/* ---------- utilidades ---------- */
function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }

function svgEl(tag, attrs){
  var el = document.createElementNS(SVG_NS, tag);
  if (attrs){ for (var k in attrs){ el.setAttribute(k, attrs[k]); } }
  return el;
}

var measureCtx = document.createElement("canvas").getContext("2d");
function measureTextWidth(text){
  measureCtx.font = "500 12.5px 'Public Sans', sans-serif";
  return measureCtx.measureText(text || "").width;
}
function measureNoteTextWidth(text, fontStr){
  measureCtx.font = fontStr;
  return measureCtx.measureText(text || "").width;
}
// Anotações agora têm formatação "rica": cada anotação guarda node.runs — uma lista de
// parágrafos, cada parágrafo uma lista de "trechos" (runs) { text, bold, italic, underline,
// fontSize } — o que permite negrito/itálico/sublinhado/tamanho diferentes dentro da MESMA
// caixa, aplicados ao texto que o usuário seleciona (em vez de formatar a caixa toda de uma vez).
function fontStringForRunStyle(style){
  var weight = (style && style.bold) ? "700" : "400";
  var italic = (style && style.italic) ? "italic " : "";
  var size = (style && style.fontSize) || 12;
  return italic + weight + " " + size + "px 'Public Sans', sans-serif";
}
function pieceWidth(piece){ return measureNoteTextWidth(piece.text, fontStringForRunStyle(piece.style)); }
function runsToPlainText(paragraphs){
  return (paragraphs || []).map(function(runs){
    return (runs || []).map(function(r){ return r.text; }).join("");
  }).join("\n");
}
function appendSpacePiece(pieces, style){
  var last = pieces[pieces.length - 1];
  if (last && last.style.bold === style.bold && last.style.italic === style.italic &&
      last.style.underline === style.underline && last.style.fontSize === style.fontSize){
    last.text += " ";
  } else {
    pieces.push({ text:" ", style:style });
  }
}
function makeEmptyLine(){
  return { pieces:[{ text:"", style:{ bold:false, italic:false, underline:false, fontSize:12 } }], lastOfPara:true, width:0, maxFontSize:12, naturalText:"" };
}
function finalizeLine(pieces, lastOfPara){
  var merged = [];
  pieces.forEach(function(p){
    var last = merged[merged.length - 1];
    if (last && last.style.bold === p.style.bold && last.style.italic === p.style.italic &&
        last.style.underline === p.style.underline && last.style.fontSize === p.style.fontSize){
      last.text += p.text;
    } else {
      merged.push({ text:p.text, style:p.style });
    }
  });
  if (!merged.length) merged.push({ text:"", style:{ bold:false, italic:false, underline:false, fontSize:12 } });
  var width = 0, maxFontSize = 12, naturalText = "";
  merged.forEach(function(p){ width += pieceWidth(p); maxFontSize = Math.max(maxFontSize, p.style.fontSize || 12); naturalText += p.text; });
  return { pieces:merged, lastOfPara:lastOfPara, width:width, maxFontSize:maxFontSize, naturalText:naturalText };
}
// Quebra os parágrafos (com formatação por trecho) em linhas que cabem em maxWidth. As palavras
// nunca são quebradas no meio, mesmo quando a formatação muda dentro de uma palavra (ex.: metade
// em negrito). Cada linha guarda "lastOfPara" (última linha do parágrafo) — no alinhamento
// justificado essa linha final fica à esquerda normalmente, como é costume.
function wrapNoteRuns(paragraphs, maxWidth){
  var lines = [];
  var paras = (paragraphs && paragraphs.length) ? paragraphs : [[]];
  paras.forEach(function(runs){
    var wordTokens = [];
    (runs || []).forEach(function(r){
      var style = { bold:!!r.bold, italic:!!r.italic, underline:!!r.underline, fontSize:r.fontSize || 12 };
      var parts = String(r.text || "").split(/(\s+)/);
      parts.forEach(function(p){
        if (p === "") return;
        if (/^\s+$/.test(p)){ wordTokens.push({ isSpace:true }); return; }
        var last = wordTokens[wordTokens.length - 1];
        if (last && !last.isSpace){ last.pieces.push({ text:p, style:style }); }
        else { wordTokens.push({ isSpace:false, pieces:[{ text:p, style:style }] }); }
      });
    });
    var words = wordTokens.filter(function(t){ return !t.isSpace; });
    if (words.length === 0){ lines.push(makeEmptyLine()); return; }
    var curPieces = [], curWidth = 0;
    words.forEach(function(word){
      var wWidth = 0;
      word.pieces.forEach(function(p){ wWidth += pieceWidth(p); });
      var spaceStyle = word.pieces[0].style;
      var spaceW = curPieces.length ? measureNoteTextWidth(" ", fontStringForRunStyle(spaceStyle)) : 0;
      var testWidth = curWidth + spaceW + wWidth;
      if (curPieces.length && testWidth > maxWidth){
        lines.push(finalizeLine(curPieces, false));
        curPieces = word.pieces.slice();
        curWidth = wWidth;
      } else {
        if (curPieces.length){ appendSpacePiece(curPieces, spaceStyle); curWidth += spaceW; }
        curPieces = curPieces.concat(word.pieces);
        curWidth += wWidth;
      }
    });
    lines.push(finalizeLine(curPieces, true));
  });
  if (lines.length === 0) lines.push(makeEmptyLine());
  return lines;
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function showToast(msg, kind){
  var t = document.createElement("div");
  t.className = "toast" + (kind === "warn" ? " warn" : "");
  t.textContent = msg;
  toastWrap.appendChild(t);
  setTimeout(function(){
    t.style.transition = "opacity .25s ease";
    t.style.opacity = "0";
    setTimeout(function(){ t.remove(); }, 260);
  }, 3600);
}

function askConfirm(title, msg, okLabel, dangerous){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="modal-actions">' +
          '<button data-a="cancel">Cancelar</button>' +
          '<button data-a="ok" class="primary' + (dangerous ? ' dangerous' : '') + '">' + escapeHtml(okLabel) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    backdrop.addEventListener("click", function(e){
      if (e.target === backdrop){ cleanup(false); }
    });
    backdrop.querySelector('[data-a="cancel"]').addEventListener("click", function(){ cleanup(false); });
    backdrop.querySelector('[data-a="ok"]').addEventListener("click", function(){ cleanup(true); });
    function cleanup(v){ backdrop.remove(); resolve(v); }
  });
}

// Igual a askConfirm, mas com três opções em vez de duas (ex.: Sim / Não / Limpar). `choices` é
// uma lista de { key, label, className, isDefault, isCancel } — isDefault leva o foco inicial
// (então Enter/Espaço já ativa aquele botão), isCancel é o que fecha o modal ao clicar fora dele.
// Resolve com a "key" escolhida.
function askChoice3(title, msg, choices){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    var buttonsHtml = choices.map(function(c){
      return '<button data-a="' + c.key + '" class="' + (c.className || "") + '">' + escapeHtml(c.label) + '</button>';
    }).join("");
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="modal-actions">' + buttonsHtml + '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    var cancelChoice = choices.filter(function(c){ return c.isCancel; })[0];
    backdrop.addEventListener("click", function(e){
      if (e.target === backdrop){ cleanup(cancelChoice ? cancelChoice.key : null); }
    });
    choices.forEach(function(c){
      backdrop.querySelector('[data-a="' + c.key + '"]').addEventListener("click", function(){ cleanup(c.key); });
    });
    var defaultChoice = choices.filter(function(c){ return c.isDefault; })[0];
    if (defaultChoice){
      var defBtn = backdrop.querySelector('[data-a="' + defaultChoice.key + '"]');
      if (defBtn) defBtn.focus();
    }
    function cleanup(v){ backdrop.remove(); resolve(v); }
  });
}

// Modal com um campo numérico (usado ao soltar o triângulo de Generalização sobre uma entidade —
// ver placeGeneralizationOnEntity). Resolve com o número escolhido (sempre um inteiro dentro de
// [minValue,maxValue]) ou com null se o usuário cancelar (clicando fora ou em "Cancelar").
function askNumberPrompt(title, msg, defaultValue, minValue, maxValue){
  return new Promise(function(resolve){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal-box">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<div class="field"><label for="numPromptInput">Quantidade de entidades</label>' +
        '<input type="number" id="numPromptInput" min="' + minValue + '" max="' + maxValue + '" step="1" value="' + defaultValue + '"></div>' +
        '<div class="modal-actions">' +
          '<button data-a="cancel">Cancelar</button>' +
          '<button data-a="ok" class="primary">Criar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);
    var input = backdrop.querySelector("#numPromptInput");
    function submit(){
      var v = Math.round(Number(input.value));
      if (!isFinite(v)) v = defaultValue;
      v = clamp(v, minValue, maxValue);
      cleanup(v);
    }
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); submit(); }
    });
    backdrop.addEventListener("click", function(e){ if (e.target === backdrop) cleanup(null); });
    backdrop.querySelector('[data-a="cancel"]').addEventListener("click", function(){ cleanup(null); });
    backdrop.querySelector('[data-a="ok"]').addEventListener("click", submit);
    function cleanup(v){ backdrop.remove(); resolve(v); }
    input.focus();
    input.select();
  });
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

/* ---------- modelo de dados ---------- */
// attrAnchorV: 2 = a coordenada x de um atributo simples (sem elipse) é a borda ESQUERDA do
// texto. Estados sem essa marca (ou com valor diferente) vêm de antes dessa convenção — nesse
// caso a x salva era o CENTRO do texto, e normalizeLoadedState() faz a migração ao carregar.
function freshState(name){
  return {
    projectName: name || "Novo Modelo Conceitual",
    nodes: [],
    edges: [],
    nextIds: { entity:1, relationship:1, attribute:1, generalization:1, note:1 },
    attrAnchorV: 2
  };
}

// Modelo lógico: um projeto novo começa sem nenhum (logicalModel fica null) até o usuário
// selecionar "Modelagem Lógica" pela primeira vez, quando é gerado automaticamente a partir do
// modelo conceitual (ver convertConceptualToLogical). edges é sempre reconstruído a partir das
// colunas FK das tabelas (rebuildLogicalEdges), nunca editado diretamente.
function freshLogicalState(name){
  return {
    projectName: name || "Novo Modelo Conceitual",
    nodes: [],
    edges: [],
    nextIds: { table:1, note:1 }
  };
}

function addNodeAt(type, opts, x, y){
  var labels = { entity:"Entidade", relationship:"Relacionamento", attribute:"Atributo", generalization:"Generalização", note:"Anotação", table:"Tabela" };
  var n = Object.assign({
    id: uid("nd"),
    type: type,
    name: labels[type] + " " + (state.nextIds[type]++),
    x: x, y: y,
    weak: false, identifying: false,
    attrKind: "simple", isKey: false,
    coverage: "partial", overlap: "disjoint",
    noteW: null, noteH: null, align: "left",
    runs: [[]]
  }, opts || {});
  if (n.type === "note") n.text = runsToPlainText(n.runs);
  state.nodes.push(n);
  return n;
}

function getNode(id){
  for (var i=0;i<state.nodes.length;i++){ if (state.nodes[i].id === id) return state.nodes[i]; }
  return null;
}
function getEdge(id){
  for (var i=0;i<state.edges.length;i++){ if (state.edges[i].id === id) return state.edges[i]; }
  return null;
}

function connectionInfo(a, b){
  if (a.id === b.id) return { ok:false };
  if (a.type === "note" || b.type === "note") return { ok:false, reason:"Anotações são notas livres e não se conectam a outros elementos." };
  if (a.type === "table" || b.type === "table"){
    if (a.type !== "table" || b.type !== "table"){
      return { ok:false, reason:"Tabelas só se conectam a outras tabelas (chave estrangeira)." };
    }
    var hasPk = (b.columns || []).some(function(c){ return c.pk; });
    if (!hasPk){
      return { ok:false, reason:'A tabela "' + (b.name || "") + '" precisa ter uma coluna marcada como PK antes de receber uma referência (FK).' };
    }
    return { ok:true, kind:"fk" };
  }
  var ta = a.type, tb = b.type;
  var pair = [ta, tb].slice().sort().join("-");
  if (pair === "entity-relationship") return { ok:true, kind:"participation" };
  if (ta === "attribute" || tb === "attribute"){
    var other = ta === "attribute" ? tb : ta;
    if (other === "entity" || other === "relationship" || other === "attribute") return { ok:true, kind:"plain" };
    return { ok:false, reason:"Atributos só se conectam a entidades, relacionamentos ou outro atributo (composição)." };
  }
  if (pair === "entity-generalization") return { ok:true, kind:"plain" };
  // Duas entidades não se ligam diretamente na notação Entidade-Relacionamento — é sempre um
  // relacionamento que as associa. Em vez de recusar a conexão, "Conectar" cria esse
  // relacionamento automaticamente (ver handleNodeClick), já ligado às duas entidades.
  if (ta === "entity" && tb === "entity") return { ok:true, kind:"auto-relationship" };
  return { ok:false, reason:"Essa conexão não é válida na notação Entidade-Relacionamento." };
}

function deleteNode(id){
  var removedEdgeIds = state.edges.filter(function(e){ return e.from === id || e.to === id; }).map(function(e){ return e.id; });
  state.nodes = state.nodes.filter(function(n){ return n.id !== id; });
  state.edges = state.edges.filter(function(e){ return e.from !== id && e.to !== id; });
  selectedNodeIds.delete(id);
  removedEdgeIds.forEach(function(eid){ selectedEdgeIds.delete(eid); });
}
function deleteEdge(id){
  state.edges = state.edges.filter(function(e){ return e.id !== id; });
  selectedEdgeIds.delete(id);
}
function deleteSelection(){
  if (selectedNodeIds.size === 0 && selectedEdgeIds.size === 0) return;
  Array.from(selectedNodeIds).forEach(deleteNode);
  Array.from(selectedEdgeIds).forEach(deleteEdge);
  selectedNodeIds.clear(); selectedEdgeIds.clear();
  render();
}

/* ---------- copiar / colar (Ctrl+C / Ctrl+V) ---------- */
// clipboard guarda um clone independente (JSON) dos nós selecionados no momento do Ctrl+C, mais
// as arestas cujas DUAS pontas estavam selecionadas (uma aresta com só uma ponta copiada não faz
// sentido colar sozinha). "mode" fica preso ao clipboard porque um nó de tabela (modelo lógico)
// não é válido no modelo conceitual e vice-versa.
var clipboard = null;
var pasteOffsetCount = 0;   // cresce a cada Ctrl+V seguido, para cada colagem aparecer um pouco deslocada da anterior

function copySelection(){
  if (selectedNodeIds.size === 0){ showToast("Selecione um ou mais elementos para copiar."); return; }
  var idSet = selectedNodeIds;
  var nodes = state.nodes.filter(function(n){ return idSet.has(n.id); }).map(function(n){ return JSON.parse(JSON.stringify(n)); });
  var edges = state.edges.filter(function(e){ return idSet.has(e.from) && idSet.has(e.to); }).map(function(e){ return JSON.parse(JSON.stringify(e)); });
  clipboard = { mode:mode, nodes:nodes, edges:edges };
  pasteOffsetCount = 0;
  showToast(nodes.length === 1 ? "1 elemento copiado." : nodes.length + " elementos copiados.");
}

function pasteClipboard(){
  if (!clipboard || !clipboard.nodes.length){ showToast("Nada para colar — copie algo primeiro com Ctrl+C."); return; }
  if (clipboard.mode !== mode){
    showToast("Isso foi copiado no outro modo de modelagem — mude para " + (clipboard.mode === "conceptual" ? "a modelagem conceitual" : "a modelagem lógica") + " para colar.", "warn");
    return;
  }
  pasteOffsetCount++;
  var offset = GRID_SIZE * pasteOffsetCount;
  var idMap = {};
  var newNodes = clipboard.nodes.map(function(n){
    var clone = JSON.parse(JSON.stringify(n));
    var newId = uid("nd");
    idMap[n.id] = newId;
    clone.id = newId;
    clone.x = n.x + offset;
    clone.y = n.y + offset;
    return clone;
  });
  // Uma coluna FK que apontava para uma tabela também copiada deve apontar para a NOVA cópia
  // dessa tabela (senão as duas cópias ficariam referenciando a tabela original, e não uma à
  // outra como no trecho copiado); uma FK para uma tabela de fora da seleção permanece apontando
  // para o original, que continua existindo.
  newNodes.forEach(function(n){
    if (n.type === "table" && n.columns){
      n.columns.forEach(function(c){
        if (c.fk && c.fkTable && idMap[c.fkTable]) c.fkTable = idMap[c.fkTable];
      });
    }
  });
  state.nodes = state.nodes.concat(newNodes);
  // No modo lógico as arestas nunca são coladas diretamente — são sempre recalculadas a partir
  // das colunas FK (rebuildLogicalEdges), e o remapeamento de fkTable acima já é suficiente.
  if (mode === "conceptual" && clipboard.edges.length){
    var newEdges = clipboard.edges.map(function(e){
      var clone = JSON.parse(JSON.stringify(e));
      clone.id = uid("ed");
      clone.from = idMap[e.from] || e.from;
      clone.to = idMap[e.to] || e.to;
      return clone;
    });
    state.edges = state.edges.concat(newEdges);
  }
  selectedNodeIds = new Set(newNodes.map(function(n){ return n.id; }));
  selectedEdgeIds = new Set();
  render();
  showToast(newNodes.length === 1 ? "1 elemento colado." : newNodes.length + " elementos colados.");
}

/* ---------- diagrama de exemplo ---------- */
function buildExampleState(){
  var s = freshState("Exemplo: Sistema Acadêmico");
  function N(type, name, x, y, extra){
    var labels = { entity:"Entidade", relationship:"Relacionamento", attribute:"Atributo", generalization:"Generalização" };
    var n = Object.assign({ id: uid("nd"), type:type, name:name, x:x, y:y,
      weak:false, identifying:false, attrKind:"simple", isKey:false, coverage:"partial", overlap:"disjoint" }, extra || {});
    s.nodes.push(n); s.nextIds[type]++;
    return n;
  }
  function E(a, b, extra){
    var e = Object.assign({ id: uid("ed"), from:a.id, to:b.id, kind:"plain", min:"1", max:"N", role:"" }, extra || {});
    s.edges.push(e);
    return e;
  }

  var pessoa = N("entity", "Pessoa", 640, 40);
  var gen = N("generalization", "Generalização", 640, 140, { coverage:"partial", overlap:"disjoint" });
  var aluno = N("entity", "Aluno", 400, 250);
  var professor = N("entity", "Professor", 860, 250);
  var profNome = N("attribute", "nome", 1040, 250, { attrKind:"simple" });

  var alunoMatricula = N("attribute", "matrícula", 170, 150, { attrKind:"simple", isKey:true });
  var alunoNomeCompleto = N("attribute", "nome completo", 170, 300, { attrKind:"composite" });
  var alunoPrimeiro = N("attribute", "primeiro nome", 40, 380, { attrKind:"simple" });
  var alunoSobrenome = N("attribute", "sobrenome", 200, 400, { attrKind:"simple" });
  var alunoTelefone = N("attribute", "telefone", 400, 400, { attrKind:"multivalued" });
  var alunoIdade = N("attribute", "idade", 560, 350, { attrKind:"derived" });

  var reside = N("relationship", "Reside", 400, 480, { identifying:true });
  var endereco = N("entity", "Endereço", 400, 610, { weak:true });
  var enderecoCep = N("attribute", "CEP", 570, 610, { attrKind:"simple", isKey:true });

  var matricula = N("relationship", "Matrícula", 640, 480);
  var disciplina = N("entity", "Disciplina", 640, 640);
  var discCodigo = N("attribute", "código", 800, 640, { attrKind:"simple", isKey:true });
  var discNome = N("attribute", "nome", 640, 760, { attrKind:"simple" });

  E(pessoa, gen);
  E(gen, aluno);
  E(gen, professor);
  E(professor, profNome, { kind:"plain" });
  E(aluno, alunoMatricula, { kind:"plain" });
  E(aluno, alunoNomeCompleto, { kind:"plain" });
  E(alunoNomeCompleto, alunoPrimeiro, { kind:"plain" });
  E(alunoNomeCompleto, alunoSobrenome, { kind:"plain" });
  E(aluno, alunoTelefone, { kind:"plain" });
  E(aluno, alunoIdade, { kind:"plain" });
  E(aluno, reside, { kind:"participation", min:"1", max:"1", role:"" });
  E(reside, endereco, { kind:"participation", min:"1", max:"1", role:"" });
  E(endereco, enderecoCep, { kind:"plain" });
  E(aluno, matricula, { kind:"participation", min:"1", max:"N", role:"cursa" });
  E(matricula, disciplina, { kind:"participation", min:"0", max:"N", role:"" });
  E(disciplina, discCodigo, { kind:"plain" });
  E(disciplina, discNome, { kind:"plain" });

  return s;
}

/* ---------- geometria ---------- */
// Atributos simples (sem elipse) são posicionados pela BORDA ESQUERDA do texto — node.x é onde
// o texto começa — em vez do centro, para que vários atributos alinhados na mesma coordenada x
// fiquem com o texto realmente alinhado à esquerda (não apenas com os centros coincidindo).
// Todos os outros tipos de nó continuam ancorados pelo centro, como sempre foram.
function isBareAttr(node){ return node.type === "attribute" && node.attrKind === "simple"; }
function centerX(node, dims){ return isBareAttr(node) ? node.x + dims.w/2 : node.x; }

function computeDims(node){
  if (node.type === "note"){
    // Largura e altura da anotação: o usuário pode redimensionar arrastando o canto (noteW/noteH
    // ficam gravados no nó); sem redimensionamento manual, usa a largura padrão e a altura se
    // ajusta sozinha ao texto. Uma vez redimensionada manualmente, a altura gravada funciona como
    // um mínimo — a caixa ainda cresce mais se o texto não couber, mas nunca fica menor que o
    // usuário escolheu.
    var w = node.noteW || NOTE_W;
    var lines = wrapNoteRuns(node.runs, w - NOTE_PAD*2);
    var lineHeights = lines.map(function(l){ return (l.maxFontSize || 12) + 5; });
    var totalTextH = lineHeights.reduce(function(a,b){ return a+b; }, 0);
    var autoH = Math.max(NOTE_MIN_H, NOTE_PAD*2 + totalTextH);
    var h = node.noteH ? Math.max(node.noteH, autoH) : autoH;
    return { w:w, h:h, lines:lines, lineHeights:lineHeights };
  }
  if (node.type === "generalization"){ return { w:46, h:34 }; }
  if (node.type === "table"){
    var cols = node.columns || [];
    measureCtx.font = "700 13px 'Public Sans', sans-serif";
    var headerW = measureCtx.measureText(node.name || "Tabela").width;
    var maxRowW = 0;
    cols.forEach(function(c){
      measureCtx.font = (c.pk ? "700 " : "500 ") + "11px 'IBM Plex Mono', monospace";
      maxRowW = Math.max(maxRowW, measureCtx.measureText(tableColumnLine(c)).width);
    });
    var tw2 = Math.max(TABLE_MIN_W, Math.ceil(Math.max(headerW, maxRowW)) + TABLE_PAD_X*2);
    var rowsH = Math.max(1, cols.length) * TABLE_ROW_H;
    var th2 = TABLE_HEADER_H + rowsH + 8;
    return { w:tw2, h:th2, cols:cols };
  }
  var d = isBareAttr(node) ? DIMS.attributeBare : DIMS[node.type];
  var tw = measureTextWidth(node.name);
  var w = Math.max(d.minW, Math.ceil(tw) + d.pad);
  return { w:w, h:d.h };
}
// Tipo completo de uma coluna: o tipo base (cadastrado em "Gerenciar tipos") mais o tamanho
// (digitado à parte, num campo próprio) entre parênteses, só quando há um tamanho informado —
// ex.: dataType "VARCHAR" + dataSize "50" vira "VARCHAR(50)"; sem tamanho, fica só "VARCHAR".
function fullDataType(c){
  if (!c) return "VARCHAR";
  var base = c.dataType || "VARCHAR";
  var size = String(c.dataSize || "").trim();
  return size ? base + "(" + size + ")" : base;
}
// Texto de uma linha de coluna da tabela: "nome : TIPO" com marcadores [PK]/[FK] quando aplicável.
function tableColumnLine(c){
  var tags = [];
  if (c.pk) tags.push("PK");
  if (c.fk) tags.push("FK");
  var suffix = tags.length ? "  [" + tags.join(", ") + "]" : "";
  return (c.name || "") + " : " + fullDataType(c) + suffix;
}

function rectBoundary(cx, cy, w, h, tx, ty){
  var hw=w/2, hh=h/2, dx=tx-cx, dy=ty-cy;
  if (dx===0 && dy===0) return { x:cx, y:cy-hh };
  var sx = dx!==0 ? hw/Math.abs(dx) : Infinity;
  var sy = dy!==0 ? hh/Math.abs(dy) : Infinity;
  var s = Math.min(sx, sy);
  return { x: cx+dx*s, y: cy+dy*s };
}
function diamondBoundary(cx, cy, w, h, tx, ty){
  var hw=w/2, hh=h/2, dx=tx-cx, dy=ty-cy;
  if (dx===0 && dy===0) return { x:cx, y:cy-hh };
  var denom = Math.abs(dx)/hw + Math.abs(dy)/hh;
  var s = denom===0 ? 0 : 1/denom;
  return { x:cx+dx*s, y:cy+dy*s };
}
function ellipseBoundary(cx, cy, w, h, tx, ty){
  var a=w/2, b=h/2, dx=tx-cx, dy=ty-cy;
  if (dx===0 && dy===0) return { x:cx, y:cy-b };
  var denom = Math.sqrt((dx*dx)/(a*a) + (dy*dy)/(b*b));
  var s = denom===0 ? 0 : 1/denom;
  return { x:cx+dx*s, y:cy+dy*s };
}
function boundaryPoint(node, dims, tx, ty){
  if (node.type === "entity" || node.type === "generalization" || node.type === "note" || node.type === "table") return rectBoundary(node.x, node.y, dims.w, dims.h, tx, ty);
  if (node.type === "relationship") return diamondBoundary(node.x, node.y, dims.w, dims.h, tx, ty);
  if (isBareAttr(node)) return rectBoundary(centerX(node, dims), node.y, dims.w, dims.h, tx, ty);
  return ellipseBoundary(node.x, node.y, dims.w, dims.h, tx, ty);
}

/* ---------- viewBox / pan / zoom ---------- */
function applyViewBox(){
  stageEl.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
}
function screenToSvg(clientX, clientY){
  var r = stageEl.getBoundingClientRect();
  return {
    x: view.x + (clientX - r.left) / r.width * view.w,
    y: view.y + (clientY - r.top) / r.height * view.h
  };
}
function zoomBy(factor, cx, cy){
  var newW = clamp(view.w * factor, 260, 6000);
  var newH = newW * (view.h / view.w);
  if (cx === undefined){ cx = view.x + view.w/2; cy = view.y + view.h/2; }
  var fx = (cx - view.x) / view.w, fy = (cy - view.y) / view.h;
  view.w = newW; view.h = newH;
  view.x = cx - fx*newW; view.y = cy - fy*newH;
  applyViewBox();
}
function fitToContent(){
  if (state.nodes.length === 0){
    var r0 = stageEl.getBoundingClientRect();
    var ratio0 = (r0.width || 1200) / (r0.height || 800);
    var w0 = 1200;
    view = { x:0, y:0, w:w0, h:w0/ratio0 };
    applyViewBox();
    return;
  }
  var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  state.nodes.forEach(function(n){
    var d = computeDims(n);
    var cx = centerX(n, d);
    minX = Math.min(minX, cx - d.w/2); maxX = Math.max(maxX, cx + d.w/2);
    minY = Math.min(minY, n.y - d.h/2); maxY = Math.max(maxY, n.y + d.h/2);
  });
  var pad = 90;
  minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  var w = Math.max(400, maxX-minX), h = Math.max(300, maxY-minY);
  var rect = stageEl.getBoundingClientRect();
  var ratio = (rect.width||1200) / (rect.height||800);
  if (w/h > ratio){ h = w/ratio; } else { w = h*ratio; }
  view = { x:minX-(w-(maxX-minX))/2, y:minY-(h-(maxY-minY))/2, w:w, h:h };
  applyViewBox();
}

/* ---------- renderização ---------- */
var edgeDom = {};   // edge.id -> { line, hit, bg, txt, rtxt }  (referências ao vivo para reposicionar durante o arraste)
var nodeDom = {};   // node.id -> elemento <g>  (referência ao vivo para mover vários nós juntos durante o arraste)

// redrawStage() cuida só do desenho SVG (nós e arestas), sem tocar no painel de propriedades —
// usado pelas edições de texto da anotação (que têm uma caixa contenteditable "viva" no painel)
// para não recriar o DOM do editor a cada tecla digitada, o que perderia o foco/seleção do
// usuário. render() faz tudo: redesenha o quadro e também reconstrói o painel inteiro.
function redrawStage(){
  applyViewBox();
  // No modo lógico, as ligações (linhas de chave estrangeira) nunca são editadas diretamente —
  // são sempre recalculadas a partir das colunas FK das tabelas, então a fonte da verdade é só
  // node.columns; isso evita as arestas desalinharem do que está de fato marcado como FK.
  if (mode === "logical") rebuildLogicalEdges();
  edgesGroup.innerHTML = "";
  nodesGroup.innerHTML = "";
  edgeDom = {};
  nodeDom = {};

  var dimsById = {};
  state.nodes.forEach(function(n){ dimsById[n.id] = computeDims(n); n._dims = dimsById[n.id]; });

  state.edges.forEach(function(edge){ renderEdge(edge, dimsById); });
  state.nodes.forEach(function(node){ renderNode(node, dimsById[node.id]); });

  stageEl.classList.toggle("mode-connect", connectMode);
  stageEl.classList.toggle("mode-place", !!pendingAdd);
}
function render(){
  redrawStage();
  updatePanel();
  updateToolbarActive();
  scheduleAutosave();
}

// Reconstrói state.edges do modelo lógico a partir das colunas FK de cada tabela — uma ligação
// por par (tabela-que-referencia, tabela-referenciada), com o(s) nome(s) das colunas FK como
// rótulo. Chamada a cada redesenho, então marcar/editar uma FK (pelo "Conectar" ou pelo painel)
// sempre se reflete na linha desenhada, sem precisar manter as duas coisas sincronizadas à mão.
function rebuildLogicalEdges(){
  var edges = [];
  state.nodes.forEach(function(t){
    if (t.type !== "table") return;
    var byTarget = {};
    (t.columns || []).forEach(function(c){
      if (c.fk && c.fkTable && getNode(c.fkTable)){
        var grp = (byTarget[c.fkTable] = byTarget[c.fkTable] || { names:[], cardChild:null, cardParent:null });
        grp.names.push(c.name);
        // A cardinalidade (quando existe) é a mesma para todas as colunas de uma FK composta —
        // guardada em cada coluna gerada pela conversão (ver convertConceptualToLogical) — então
        // basta pegar da primeira coluna do grupo que tiver essa informação.
        if (!grp.cardChild && c.cardChild) grp.cardChild = c.cardChild;
        if (!grp.cardParent && c.cardParent) grp.cardParent = c.cardParent;
      }
    });
    Object.keys(byTarget).forEach(function(targetId){
      var grp = byTarget[targetId];
      edges.push({ id:"fk_" + t.id + "_" + targetId, from:t.id, to:targetId, kind:"fk", role:grp.names.join(", "), cardChild:grp.cardChild, cardParent:grp.cardParent });
    });
  });
  state.edges = edges;
}

function renderEdge(edge, dimsById){
  var a = getNode(edge.from), b = getNode(edge.to);
  if (!a || !b) return;
  var da = dimsById[a.id], db = dimsById[b.id];
  var pa = boundaryPoint(a, da, centerX(b, db), b.y);
  var pb = boundaryPoint(b, db, centerX(a, da), a.y);
  var selected = selectedEdgeIds.has(edge.id);

  var g = svgEl("g", {});
  var hit = svgEl("line", { class:"edge-hit", x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y });
  var line = svgEl("line", { class:"edge-line" + (selected ? " selected" : ""), x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y });
  g.appendChild(hit); g.appendChild(line);

  function onEdgeSelect(e){
    e.stopPropagation();
    if (e.shiftKey){
      if (selectedEdgeIds.has(edge.id)) selectedEdgeIds.delete(edge.id); else selectedEdgeIds.add(edge.id);
    } else {
      selectedEdgeIds = new Set([edge.id]);
      selectedNodeIds = new Set();
    }
    render();
  }
  hit.addEventListener("pointerdown", onEdgeSelect);

  var bgEl = null, txtEl = null, rtxtEl = null;
  if (edge.kind === "participation"){
    var entityNode = a.type === "entity" ? a : b;
    var entityPoint = a.type === "entity" ? pa : pb;
    var otherPoint = a.type === "entity" ? pb : pa;
    var t = 0.30;
    var px = entityPoint.x + (otherPoint.x - entityPoint.x) * t;
    var py = entityPoint.y + (otherPoint.y - entityPoint.y) * t;
    var label = "(" + (edge.min || "0") + "," + (edge.max || "N") + ")";
    var tw = Math.max(30, measureTextWidth(label) + 10);
    var bg = svgEl("rect", { class:"card-pill-bg", x:px-tw/2, y:py-9, width:tw, height:18, rx:4 });
    var txt = svgEl("text", { class:"card-pill-text", x:px, y:py+1 });
    txt.textContent = label;
    g.appendChild(bg); g.appendChild(txt);
    bg.addEventListener("pointerdown", onEdgeSelect);
    txt.style.pointerEvents = "none";
    bgEl = bg; txtEl = txt;

    if (edge.role){
      var mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;
      var rtxt = svgEl("text", { class:"role-text", x:mx, y:my-10 });
      rtxt.textContent = edge.role;
      g.appendChild(rtxt);
      rtxtEl = rtxt;
    }
  }
  var bgChildEl = null, txtChildEl = null, bgParentEl = null, txtParentEl = null;
  if (edge.kind === "fk"){
    // Linha de chave estrangeira: sem rótulo de nome (o usuário optou por não mostrar os nomes
    // das colunas FK nas linhas), apenas, quando a conversão trouxe a cardinalidade do
    // relacionamento original (ver convertConceptualToLogical), uma pílula (min,max) em cada
    // ponta — a mesma que aparecia junto de cada entidade no diagrama conceitual.
    if (edge.cardChild){
      var cLabel = "(" + (edge.cardChild.min || "0") + "," + (edge.cardChild.max || "N") + ")";
      var cx2 = pa.x + (pb.x - pa.x) * 0.25, cy2 = pa.y + (pb.y - pa.y) * 0.25;
      var ctw = Math.max(30, measureTextWidth(cLabel) + 10);
      var cbg = svgEl("rect", { class:"card-pill-bg", x:cx2-ctw/2, y:cy2-9, width:ctw, height:18, rx:4 });
      var ctxt = svgEl("text", { class:"card-pill-text", x:cx2, y:cy2+1 });
      ctxt.textContent = cLabel;
      g.appendChild(cbg); g.appendChild(ctxt);
      cbg.addEventListener("pointerdown", onEdgeSelect);
      ctxt.style.pointerEvents = "none";
      bgChildEl = cbg; txtChildEl = ctxt;
    }
    if (edge.cardParent){
      var pLabel = "(" + (edge.cardParent.min || "0") + "," + (edge.cardParent.max || "N") + ")";
      var px2 = pa.x + (pb.x - pa.x) * 0.75, py2 = pa.y + (pb.y - pa.y) * 0.75;
      var ptw = Math.max(30, measureTextWidth(pLabel) + 10);
      var pbg = svgEl("rect", { class:"card-pill-bg", x:px2-ptw/2, y:py2-9, width:ptw, height:18, rx:4 });
      var ptxt = svgEl("text", { class:"card-pill-text", x:px2, y:py2+1 });
      ptxt.textContent = pLabel;
      g.appendChild(pbg); g.appendChild(ptxt);
      pbg.addEventListener("pointerdown", onEdgeSelect);
      ptxt.style.pointerEvents = "none";
      bgParentEl = pbg; txtParentEl = ptxt;
    }
  }

  edgeDom[edge.id] = { line:line, hit:hit, bg:bgEl, txt:txtEl, rtxt:rtxtEl, bgChild:bgChildEl, txtChild:txtChildEl, bgParent:bgParentEl, txtParent:txtParentEl };
  edgesGroup.appendChild(g);
}

/* Reposiciona (sem recriar) as arestas ligadas a um nó — usado durante o arraste, para manter
   a captura do ponteiro no elemento original e permitir mover por vários pixels seguidos. */
function updateConnectedEdgeDom(nodeId){
  state.edges.forEach(function(edge){
    if (edge.from !== nodeId && edge.to !== nodeId) return;
    var refs = edgeDom[edge.id];
    if (!refs) return;
    var a = getNode(edge.from), b = getNode(edge.to);
    if (!a || !b) return;
    var da = a._dims || computeDims(a), db = b._dims || computeDims(b);
    var pa = boundaryPoint(a, da, centerX(b, db), b.y);
    var pb = boundaryPoint(b, db, centerX(a, da), a.y);
    refs.line.setAttribute("x1", pa.x); refs.line.setAttribute("y1", pa.y);
    refs.line.setAttribute("x2", pb.x); refs.line.setAttribute("y2", pb.y);
    refs.hit.setAttribute("x1", pa.x); refs.hit.setAttribute("y1", pa.y);
    refs.hit.setAttribute("x2", pb.x); refs.hit.setAttribute("y2", pb.y);
    if (edge.kind === "participation" && refs.bg && refs.txt){
      var entityPoint = a.type === "entity" ? pa : pb;
      var otherPoint = a.type === "entity" ? pb : pa;
      var t = 0.30;
      var px = entityPoint.x + (otherPoint.x - entityPoint.x) * t;
      var py = entityPoint.y + (otherPoint.y - entityPoint.y) * t;
      var label = "(" + (edge.min || "0") + "," + (edge.max || "N") + ")";
      var tw = Math.max(30, measureTextWidth(label) + 10);
      refs.bg.setAttribute("x", px - tw/2); refs.bg.setAttribute("y", py - 9); refs.bg.setAttribute("width", tw);
      refs.txt.setAttribute("x", px); refs.txt.setAttribute("y", py + 1);
    }
    if (edge.kind === "fk"){
      if (refs.bgChild && refs.txtChild && edge.cardChild){
        var cLabel = "(" + (edge.cardChild.min || "0") + "," + (edge.cardChild.max || "N") + ")";
        var cx2 = pa.x + (pb.x - pa.x) * 0.25, cy2 = pa.y + (pb.y - pa.y) * 0.25;
        var ctw = Math.max(30, measureTextWidth(cLabel) + 10);
        refs.bgChild.setAttribute("x", cx2 - ctw/2); refs.bgChild.setAttribute("y", cy2 - 9); refs.bgChild.setAttribute("width", ctw);
        refs.txtChild.setAttribute("x", cx2); refs.txtChild.setAttribute("y", cy2 + 1);
      }
      if (refs.bgParent && refs.txtParent && edge.cardParent){
        var pLabel = "(" + (edge.cardParent.min || "0") + "," + (edge.cardParent.max || "N") + ")";
        var px2 = pa.x + (pb.x - pa.x) * 0.75, py2 = pa.y + (pb.y - pa.y) * 0.75;
        var ptw = Math.max(30, measureTextWidth(pLabel) + 10);
        refs.bgParent.setAttribute("x", px2 - ptw/2); refs.bgParent.setAttribute("y", py2 - 9); refs.bgParent.setAttribute("width", ptw);
        refs.txtParent.setAttribute("x", px2); refs.txtParent.setAttribute("y", py2 + 1);
      }
    }
    if (refs.rtxt){
      var mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
      refs.rtxt.setAttribute("x", mx); refs.rtxt.setAttribute("y", my - 10);
    }
  });
}

function renderNode(node, dims){
  var g = svgEl("g", { class:"node-g" });
  var selected = selectedNodeIds.has(node.id);
  var isConnectPending = connectFrom === node.id;
  var cx = centerX(node, dims);

  if (node.type === "entity"){
    g.appendChild(svgEl("rect", { class:"shape-entity", x:node.x-dims.w/2, y:node.y-dims.h/2, width:dims.w, height:dims.h, rx:5 }));
    if (node.weak){
      var inset = 5;
      g.appendChild(svgEl("rect", { class:"shape-entity-inner", x:node.x-dims.w/2+inset, y:node.y-dims.h/2+inset, width:dims.w-inset*2, height:dims.h-inset*2, rx:3 }));
    }
  } else if (node.type === "relationship"){
    g.appendChild(svgEl("polygon", { class:"shape-relationship", points: diamondPoints(node.x, node.y, dims.w, dims.h) }));
    if (node.identifying){
      g.appendChild(svgEl("polygon", { class:"shape-relationship-inner", points: diamondPoints(node.x, node.y, dims.w-14, dims.h-14) }));
    }
  } else if (node.type === "attribute"){
    if (node.attrKind === "simple"){
      // Atributo simples: sem elipse ao redor, só o texto — o retângulo abaixo é invisível
      // e serve apenas como área de clique/seleção do elemento.
      g.appendChild(svgEl("rect", { class:"attr-hit", x:cx-dims.w/2, y:node.y-dims.h/2, width:dims.w, height:dims.h }));
    } else {
      var cls = "shape-attribute" + (node.attrKind === "derived" ? " derived" : "");
      g.appendChild(svgEl("ellipse", { class:cls, cx:node.x, cy:node.y, rx:dims.w/2, ry:dims.h/2 }));
      if (node.attrKind === "multivalued"){
        g.appendChild(svgEl("ellipse", { class:"shape-attribute-inner", cx:node.x, cy:node.y, rx:dims.w/2-5, ry:dims.h/2-5 }));
      }
    }
  } else if (node.type === "generalization"){
    g.appendChild(svgEl("polygon", { class:"shape-gen", points: trianglePoints(node.x, node.y, dims.w, dims.h) }));
    var code = (node.coverage === "total" ? "T" : "P") + (node.overlap === "disjoint" ? "D" : "S");
    var glabel = svgEl("text", { class:"gen-label", x:node.x, y:node.y+4 });
    glabel.textContent = code;
    g.appendChild(glabel);
  } else if (node.type === "note"){
    // Nota livre: retângulo tracejado + texto quebrado em várias linhas conforme necessário.
    // Cada linha pode conter trechos (runs) com negrito/itálico/sublinhado/tamanho diferentes —
    // cada trecho vira um <tspan> próprio dentro do <text> da linha; só o primeiro <tspan> de
    // cada linha recebe x/text-anchor, então o SVG trata a linha inteira como um único bloco de
    // texto para fins de alinhamento (os <tspan> seguintes simplesmente continuam na mesma linha).
    g.appendChild(svgEl("rect", { class:"shape-note", x:node.x-dims.w/2, y:node.y-dims.h/2, width:dims.w, height:dims.h, rx:4 }));
    var noteLines = dims.lines && dims.lines.length ? dims.lines : [makeEmptyLine()];
    var textAreaW = dims.w - NOTE_PAD*2;
    var noteLeft = node.x - dims.w/2 + NOTE_PAD;
    var noteRight = node.x + dims.w/2 - NOTE_PAD;
    var align = node.align || "left";
    var topY = node.y - dims.h/2 + NOTE_PAD;
    noteLines.forEach(function(line, i){
      var lh = dims.lineHeights[i] || ((line.maxFontSize || 12) + 5);
      var baselineY = topY + lh*0.78;
      topY += lh;
      var startX, anchor;
      if (align === "center"){ startX = node.x; anchor = "middle"; }
      else if (align === "right"){ startX = noteRight; anchor = "end"; }
      else { startX = noteLeft; anchor = "start"; }
      // Linhas "internas" de um parágrafo (não a última) são esticadas proporcionalmente para
      // preencher toda a largura — textLength/lengthAdjust é o jeito nativo do SVG de fazer
      // isso, aplicado a cada trecho para que a soma dê exatamente a largura disponível.
      var stretch = null;
      if (align === "justify" && !line.lastOfPara && line.naturalText.indexOf(" ") !== -1 && line.width > 0 && line.width < textAreaW){
        stretch = textAreaW / line.width;
      }
      var lt = svgEl("text", { class:"note-text", y:baselineY });
      line.pieces.forEach(function(p, pi){
        var attrs = {
          "font-size": p.style.fontSize,
          "font-weight": p.style.bold ? "700" : "400",
          "font-style": p.style.italic ? "italic" : "normal",
          "text-decoration": p.style.underline ? "underline" : "none"
        };
        if (pi === 0){ attrs.x = startX; attrs["text-anchor"] = anchor; }
        if (stretch){
          attrs.textLength = Math.round(pieceWidth(p) * stretch * 100) / 100;
          attrs.lengthAdjust = "spacing";
        }
        var tsp = svgEl("tspan", attrs);
        tsp.textContent = p.text;
        lt.appendChild(tsp);
      });
      g.appendChild(lt);
    });
  } else if (node.type === "table"){
    // Tabela do modelo lógico: caixa + cabeçalho (nome da tabela) + uma linha de texto por
    // coluna, com PK em negrito/sublinhado e FK em itálico (ver CSS .table-row-text.pk/.fk).
    var cols = dims.cols || node.columns || [];
    var left = node.x - dims.w/2, top = node.y - dims.h/2;
    g.appendChild(svgEl("rect", { class:"shape-table", x:left, y:top, width:dims.w, height:dims.h, rx:5 }));
    var headerTxt = svgEl("text", { class:"table-header-text", x:node.x, y:top + TABLE_HEADER_H/2 + 4 });
    headerTxt.textContent = node.name || "Tabela";
    g.appendChild(headerTxt);
    g.appendChild(svgEl("line", { class:"table-divider", x1:left, y1:top+TABLE_HEADER_H, x2:left+dims.w, y2:top+TABLE_HEADER_H }));
    var rowY = top + TABLE_HEADER_H + TABLE_ROW_H*0.68;
    if (cols.length){
      cols.forEach(function(c){
        var rowCls = "table-row-text" + (c.pk ? " pk" : "") + (c.fk && !c.pk ? " fk" : "");
        var rt = svgEl("text", { class:rowCls, x:left+TABLE_PAD_X, y:rowY });
        rt.textContent = tableColumnLine(c);
        g.appendChild(rt);
        rowY += TABLE_ROW_H;
      });
    } else {
      var emptyTxt = svgEl("text", { class:"table-row-text", x:left+TABLE_PAD_X, y:rowY });
      emptyTxt.textContent = "(sem colunas)";
      g.appendChild(emptyTxt);
    }
  }

  if (node.type !== "generalization" && node.type !== "note" && node.type !== "table"){
    var labelCls = "node-label" + (node.isKey ? " key" : "") + (node.type === "relationship" ? " relationship-label" : node.type === "entity" ? " entity-label" : node.type === "attribute" ? " attribute-label" : "") + (isBareAttr(node) ? " left-align" : "");
    // Atributo simples: texto começa em node.x (alinhado à esquerda). Os demais tipos
    // continuam com o texto centralizado em node.x, como sempre.
    var txt = svgEl("text", { class:labelCls, x:node.x, y:node.y+1 });
    txt.textContent = node.name;
    g.appendChild(txt);
  }

  if (selected){
    g.appendChild(svgEl("rect", { class:"sel-ring", x:cx-dims.w/2-6, y:node.y-dims.h/2-6, width:dims.w+12, height:dims.h+12, rx:8 }));
  }
  if (isConnectPending){
    g.appendChild(svgEl("rect", { class:"connect-ring", x:cx-dims.w/2-9, y:node.y-dims.h/2-9, width:dims.w+18, height:dims.h+18, rx:9 }));
  }
  if (selected && node.type === "note"){
    // Alça de redimensionamento: aparece só com a anotação selecionada, no canto inferior
    // direito. Arrastá-la muda a largura (o texto quebra de novo) e a altura da caixa.
    var handleSize = 10;
    var hx = node.x + dims.w/2, hy = node.y + dims.h/2;
    var handle = svgEl("rect", { class:"note-resize-handle", x:hx-handleSize/2, y:hy-handleSize/2, width:handleSize, height:handleSize, rx:2 });
    g.appendChild(handle);
    attachNoteResizeHandlers(handle, node);
  }

  attachNodeHandlers(g, node);
  nodeDom[node.id] = g;
  nodesGroup.appendChild(g);
}

/* Arraste do canto de uma anotação para redimensioná-la. Como node.x/node.y é o CENTRO da caixa
   (mesma convenção dos demais tipos de nó), ao crescer/encolher a largura ou altura também
   deslocamos o centro na metade da variação — assim o canto superior-esquerdo, oposto ao que
   está sendo arrastado, permanece fixo, como se espera de uma alça de redimensionamento. */
function attachNoteResizeHandlers(handleEl, node){
  handleEl.addEventListener("pointerdown", function(e){
    e.stopPropagation();
    if (e.button !== 0) return;
    var startDims = computeDims(node);
    var startW = startDims.w, startH = startDims.h;
    var startX = node.x, startY = node.y;
    var startClient = { x:e.clientX, y:e.clientY };
    var pointerId = e.pointerId;

    function onMove(ev){
      if (ev.pointerId !== pointerId) return;
      var dx = ev.clientX - startClient.x, dy = ev.clientY - startClient.y;
      var r = stageEl.getBoundingClientRect();
      var svgDx = dx * (view.w / r.width);
      var svgDy = dy * (view.h / r.height);
      var newW = clamp(startW + svgDx, NOTE_MIN_W, NOTE_MAX_W);
      var newH = clamp(startH + svgDy, NOTE_MIN_H, NOTE_MAX_H);
      node.noteW = newW;
      node.noteH = newH;
      node.x = startX + (newW - startW)/2;
      node.y = startY + (newH - startH)/2;
      render();
    }
    function finish(ev){
      if (ev && ev.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", finish);
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
  });
}

function diamondPoints(cx, cy, w, h){
  var hw=w/2, hh=h/2;
  return [cx+","+(cy-hh), (cx+hw)+","+cy, cx+","+(cy+hh), (cx-hw)+","+cy].join(" ");
}
function trianglePoints(cx, cy, w, h){
  var hw=w/2, hh=h/2;
  return [cx+","+(cy-hh), (cx+hw)+","+(cy+hh), (cx-hw)+","+(cy+hh)].join(" ");
}

/* ---------- interação: nós ---------- */
function attachNodeHandlers(g, node){
  g.addEventListener("pointerdown", function(e){
    e.stopPropagation();
    if (pendingAdd){
      // Clicar exatamente EM CIMA de um nó existente nunca chega ao handler de clique do palco
      // (o stopPropagation logo acima impede isso) — por isso soltar o triângulo de Generalização
      // sobre uma entidade precisa ser tratado aqui, não em handleGeneralizationDrop (que só é
      // alcançado ao clicar em uma área vazia do canvas). Qualquer outra combinação de
      // ferramenta+nó continua sem efeito, como sempre foi.
      if (pendingAdd.type === "generalization" && node.type === "entity" && e.button === 0){
        pendingAdd = null;
        render();
        placeGeneralizationOnEntity(node);
      }
      return;
    }
    if (e.button !== 0) return;
    // Se o nó clicado já faz parte de uma seleção múltipla, arrasta o grupo inteiro junto;
    // caso contrário, arrasta só este nó (sem alterar a seleção atual).
    var groupIds = (selectedNodeIds.has(node.id) && selectedNodeIds.size > 1) ? Array.from(selectedNodeIds) : [node.id];
    var startPositions = {};
    groupIds.forEach(function(id){
      var gn = getNode(id);
      if (gn) startPositions[id] = { x:gn.x, y:gn.y };
    });
    var startClient = { x:e.clientX, y:e.clientY };
    var moved = false;
    var pointerId = e.pointerId;
    // Os handlers de arraste ficam no "document" (em vez de usar setPointerCapture no
    // próprio elemento) porque, logo após um laço de seleção (marquee, que captura o
    // ponteiro no <svg>), voltar a capturar o ponteiro num elemento diferente faz o
    // Chrome disparar "pointercancel" no primeiro pointermove seguinte — cancelando o
    // arraste antes mesmo de começar e obrigando o usuário a soltar e arrastar de novo.
    // Ouvir no document não depende de captura e não sofre desse problema.

    function onMove(ev){
      if (ev.pointerId !== pointerId) return;
      var dx = ev.clientX - startClient.x, dy = ev.clientY - startClient.y;
      if (!moved && Math.hypot(dx,dy) > 4) moved = true;
      if (moved && !connectMode){
        var r = stageEl.getBoundingClientRect();
        var svgDx = dx * (view.w / r.width);
        var svgDy = dy * (view.h / r.height);
        // Encaixa na grade pela posição do nó "âncora" (o que foi clicado) e aplica o mesmo
        // deslocamento (já encaixado) a todo o grupo, preservando as posições relativas entre
        // os elementos selecionados. Segurar Alt desativa o encaixe temporariamente.
        if (snapToGrid && !ev.altKey){
          var anchorSp = startPositions[node.id];
          if (anchorSp){
            svgDx = snapValue(anchorSp.x + svgDx) - anchorSp.x;
            svgDy = snapValue(anchorSp.y + svgDy) - anchorSp.y;
          }
        }
        // Move só o grafismo (transform) e reposiciona as arestas ligadas, sem recriar o DOM —
        // recriar a cada pixel (render() completo) destruiria os elementos "g" arrastados e
        // derrubaria a captura do ponteiro, fazendo o arraste "pular" a cada movimento.
        groupIds.forEach(function(id){
          var gn = getNode(id);
          var sp = startPositions[id];
          if (!gn || !sp) return;
          gn.x = sp.x + svgDx;
          gn.y = sp.y + svgDy;
          var gEl = nodeDom[id];
          if (gEl) gEl.setAttribute("transform", "translate(" + svgDx + "," + svgDy + ")");
          updateConnectedEdgeDom(id);
        });
      }
    }
    function finish(ev){
      if (ev && ev.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", finish);
      if (!moved){
        handleNodeClick(node, ev ? ev.shiftKey : false);
      } else {
        render();
      }
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
  });
}

function handleNodeClick(node, additive){
  if (connectMode){
    if (node.type === "note"){
      showToast("Anotações são notas livres e não se conectam a outros elementos.", "warn");
      return;
    }
    if (connectFrom === null){
      connectFrom = node.id;
      render();
      return;
    }
    if (connectFrom === node.id){
      connectFrom = null;
      render();
      return;
    }
    var a = getNode(connectFrom), b = node;
    var info = connectionInfo(a, b);
    if (!info.ok){
      showToast(info.reason || "Conexão inválida.", "warn");
      connectFrom = null;
      render();
      return;
    }
    if (info.kind === "fk"){
      // Tabelas: "a" (clicada primeiro) recebe uma nova coluna de chave estrangeira referenciando
      // a chave primária de "b" — a linha em si é só um reflexo dessa coluna (ver rebuildLogicalEdges).
      addForeignKeyColumn(a, b);
      connectFrom = null;
      selectedNodeIds = new Set([a.id]);
      selectedEdgeIds = new Set();
      render();
      return;
    }
    if (info.kind === "auto-relationship"){
      // Duas entidades ligadas pelo "Conectar": cria um novo objeto de relacionamento a meio
      // caminho entre elas e já liga as duas a ele (participação padrão 1..N em cada lado — o
      // usuário ajusta nome e cardinalidades pelo painel depois). Evita o passo manual de
      // arrastar um relacionamento da barra de ferramentas e conectar cada entidade a ele.
      var midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
      if (snapToGrid){ midX = snapValue(midX); midY = snapValue(midY); }
      var rel = addNodeAt("relationship", {}, midX, midY);
      state.edges.push({ id: uid("ed"), from:a.id, to:rel.id, kind:"participation", min:"1", max:"N", role:"" });
      state.edges.push({ id: uid("ed"), from:b.id, to:rel.id, kind:"participation", min:"1", max:"N", role:"" });
      connectFrom = null;
      selectedNodeIds = new Set([rel.id]);
      selectedEdgeIds = new Set();
      render();
      showToast('Relacionamento criado entre "' + (a.name || "") + '" e "' + (b.name || "") + '" — edite o nome e as cardinalidades no painel.');
      return;
    }
    var edge = { id: uid("ed"), from:a.id, to:b.id, kind:info.kind, min:"1", max:"N", role:"" };
    state.edges.push(edge);
    connectFrom = null;
    selectedEdgeIds = new Set([edge.id]);
    selectedNodeIds = new Set();
    render();
    return;
  }
  if (additive){
    if (selectedNodeIds.has(node.id)) selectedNodeIds.delete(node.id); else selectedNodeIds.add(node.id);
  } else {
    selectedNodeIds = new Set([node.id]);
    selectedEdgeIds = new Set();
  }
  render();
}

// Cria em childTable uma coluna FK para cada coluna PK de parentTable (uma só, na maioria dos
// casos). connectionInfo já garantiu que parentTable tem ao menos uma PK antes de chegar aqui.
// Usada pelo "Conectar" no modo lógico; edição manual de FK pelo painel não passa por aqui.
function addForeignKeyColumn(childTable, parentTable){
  var pkCols = (parentTable.columns || []).filter(function(c){ return c.pk; });
  if (!pkCols.length) return false;
  var baseName = String(parentTable.name || "tabela").trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "_").replace(/(^_|_$)/g, "") || "ref";
  pkCols.forEach(function(pk){
    var already = (childTable.columns || []).some(function(c){ return c.fk && c.fkTable === parentTable.id && c.fkColumn === pk.name; });
    if (already) return;
    var colName = baseName + "_" + pk.name, n2 = 2;
    while ((childTable.columns || []).some(function(c){ return c.name === colName; })){ colName = baseName + "_" + pk.name + n2; n2++; }
    childTable.columns.push({ name:colName, dataType:pk.dataType || "INT", dataSize:pk.dataSize || "", pk:false, fk:true, fkTable:parentTable.id, fkColumn:pk.name });
  });
  return true;
}

// Quando uma coluna referenciada por FK(s) muda de nome, tipo e/ou tamanho (editada pelo painel
// da tabela), toda coluna FK — em qualquer tabela, inclusive na própria (auto-referência) — que
// apontava para ela (mesma fkTable + fkColumn) precisa acompanhar a mudança: senão a FK fica
// "órfã" (fkColumn passa a apontar para um nome que não existe mais) ou com um tipo/tamanho
// diferente do da chave que ela deveria espelhar. Funciona tanto para colunas marcadas PK quanto
// para qualquer outra coluna que por acaso seja referenciada por uma FK. newDataType/newDataSize
// null (não fornecido) significa "não mexe nesse campo" — sempre são passados juntos, com o par
// completo e atual da coluna alterada, para as duas pontas nunca ficarem parcialmente dessincronizadas.
function syncForeignKeysForColumnChange(refTable, oldColName, newColName, newDataType, newDataSize){
  if (oldColName === newColName && newDataType == null && newDataSize == null) return;
  state.nodes.forEach(function(t){
    if (t.type !== "table") return;
    (t.columns || []).forEach(function(c){
      if (c.fk && c.fkTable === refTable.id && c.fkColumn === oldColName){
        c.fkColumn = newColName;
        if (newDataType != null) c.dataType = newDataType;
        if (newDataSize != null) c.dataSize = newDataSize;
      }
    });
  });
}

// Uma coluna FK não tem tipo/tamanho próprios — eles só são definidos por quem ela referencia.
// Chamada sempre que a referência é criada ou trocada (marcar FK, trocar a tabela referenciada ou
// trocar a coluna referenciada), para os campos (desabilitados no painel) já nascerem com o
// tipo/tamanho certos em vez de ficarem com um valor antigo/errado até a próxima edição da PK.
function syncColumnDataTypeFromReference(col){
  var refTable = col.fkTable && getNode(col.fkTable);
  var refCol = refTable && (refTable.columns || []).filter(function(rc){ return rc.name === col.fkColumn; })[0];
  if (refCol){ col.dataType = refCol.dataType; col.dataSize = refCol.dataSize; }
}

/* ---------- teclado: Espaço = modo panorâmica (arrastar move o quadro) ---------- */
document.addEventListener("keydown", function(e){
  if (e.code === "Space"){
    var ae = document.activeElement;
    var tag = (ae && ae.tagName) || "";
    // isContentEditable cobre a caixa de texto rica da anotação (um <div contenteditable>, não
    // um <textarea>) — sem essa checagem, a barra de espaço era sequestrada pelo modo panorâmica
    // e o usuário não conseguia digitar espaços dentro da anotação.
    var inField = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || (ae && ae.isContentEditable);
    if (!inField && !spaceHeld){ spaceHeld = true; stageEl.style.cursor = "grab"; e.preventDefault(); }
  }
});
document.addEventListener("keyup", function(e){
  if (e.code === "Space"){ spaceHeld = false; stageEl.style.cursor = ""; }
});

/* ---------- interação: fundo do canvas (selecionar em laço / panorâmica / zoom / criar / desselecionar) ---------- */
function updateMarqueeRect(x1, y1, x2, y2){
  marqueeEl.setAttribute("x", Math.min(x1,x2));
  marqueeEl.setAttribute("y", Math.min(y1,y2));
  marqueeEl.setAttribute("width", Math.abs(x2-x1));
  marqueeEl.setAttribute("height", Math.abs(y2-y1));
}
function applyMarqueeSelection(x1, y1, x2, y2, additive){
  var minX=Math.min(x1,x2), maxX=Math.max(x1,x2), minY=Math.min(y1,y2), maxY=Math.max(y1,y2);
  var picked = [];
  state.nodes.forEach(function(n){
    var d = computeDims(n);
    var cx = centerX(n, d);
    var nx1=cx-d.w/2, nx2=cx+d.w/2, ny1=n.y-d.h/2, ny2=n.y+d.h/2;
    if (nx1 < maxX && nx2 > minX && ny1 < maxY && ny2 > minY) picked.push(n.id);
  });
  if (additive){
    picked.forEach(function(id){ selectedNodeIds.add(id); });
  } else {
    selectedNodeIds = new Set(picked);
    selectedEdgeIds = new Set();
  }
  render();
  if (picked.length){
    showToast(picked.length + (picked.length === 1 ? " elemento selecionado." : " elementos selecionados. Use \"Excluir selecionado\"/Delete para removê-los, ou Ctrl+C/Ctrl+V para copiá-los."));
  }
}

// Acha a entidade (se houver) sob um ponto do SVG — usada ao soltar o triângulo de Generalização
// em cima de uma entidade (ver placeGeneralizationOnEntity). Percorre de trás para frente para
// achar a mais "de cima" visualmente, caso haja sobreposição.
function entityAtPoint(pt){
  for (var i = state.nodes.length - 1; i >= 0; i--){
    var n = state.nodes[i];
    if (n.type !== "entity") continue;
    var d = computeDims(n);
    var cx = centerX(n, d);
    var x1 = cx - d.w/2, x2 = cx + d.w/2, y1 = n.y - d.h/2, y2 = n.y + d.h/2;
    if (pt.x >= x1 && pt.x <= x2 && pt.y >= y1 && pt.y <= y2) return n;
  }
  return null;
}

// Soltar o triângulo de Generalização em cima de uma entidade existente pergunta quantas
// entidades especializadas (subclasses) criar (padrão 2) e já monta a hierarquia inteira: a
// entidade "superEntity" passa a ser a superclasse (fica acima, como a notação exige — ver
// convertConceptualToLogical, que decide superclasse/subclasse pela posição Y), o triângulo é
// criado logo abaixo dela, e as subclasses são criadas abaixo do triângulo, lado a lado, todas
// já conectadas. Cancelar o número (fechar o modal) não cria nada.
// Ponto de entrada único para "soltar" o triângulo de Generalização em pt (coordenadas do SVG) —
// usado tanto pelo clique real no canvas quanto pelos testes automatizados. Se pt cair em cima de
// uma entidade, dispara o fluxo de criação automática de especialização; senão, cria só o
// triângulo vazio, como antes.
function handleGeneralizationDrop(pt){
  var targetEntity = entityAtPoint(pt);
  if (targetEntity){
    placeGeneralizationOnEntity(targetEntity);
    return;
  }
  var genNode = addNodeAt("generalization", {}, pt.x, pt.y);
  selectedNodeIds = new Set([genNode.id]);
  selectedEdgeIds = new Set();
  render();
}

async function placeGeneralizationOnEntity(superEntity){
  var n = await askNumberPrompt(
    "Generalização / Especialização",
    'Quantas entidades especializadas (subclasses) de "' + (superEntity.name || "") + '" você quer criar?',
    2, 1, 12
  );
  if (n === null) return;
  var superDims = computeDims(superEntity);
  var superCx = centerX(superEntity, superDims);
  var gapAbove = 110, gapBelow = 120, spacing = 170;
  var genX = superCx, genY = superEntity.y + gapAbove;
  var subY = genY + gapBelow;
  if (snapToGrid){ genX = snapValue(genX); genY = snapValue(genY); subY = snapValue(subY); }
  var gen = addNodeAt("generalization", {}, genX, genY);
  state.edges.push({ id: uid("ed"), from:superEntity.id, to:gen.id, kind:"plain" });
  var startX = genX - ((n - 1) * spacing) / 2;
  for (var i = 0; i < n; i++){
    var subX = startX + i * spacing;
    if (snapToGrid) subX = snapValue(subX);
    var sub = addNodeAt("entity", {}, subX, subY);
    state.edges.push({ id: uid("ed"), from:gen.id, to:sub.id, kind:"plain" });
  }
  selectedNodeIds = new Set([gen.id]);
  selectedEdgeIds = new Set();
  render();
  showToast(n === 1
    ? 'Generalização criada com 1 entidade especializada de "' + (superEntity.name || "") + '".'
    : 'Generalização criada com ' + n + ' entidades especializadas de "' + (superEntity.name || "") + '".');
}

stageEl.addEventListener("pointerdown", function(e){
  if (e.button !== 0 && e.button !== 1) return;
  var isPanGesture = e.button === 1 || spaceHeld;
  var doMarquee = !isPanGesture && !pendingAdd && !connectMode;
  var startClient = { x:e.clientX, y:e.clientY };
  var startView = { x:view.x, y:view.y };
  var startSvg = screenToSvg(e.clientX, e.clientY);
  var moved = false;
  var pointerId = e.pointerId;
  // Assim como no arraste de nós, evitamos setPointerCapture aqui: capturar o ponteiro
  // no <svg> e depois liberá-lo faz o Chrome cancelar (pointercancel) o próximo gesto de
  // arraste que usar o mesmo pointerId — inclusive um clique-e-arraste num nó logo em
  // seguida a um laço de seleção. Ouvir no document evita esse problema.

  if (doMarquee){
    updateMarqueeRect(startSvg.x, startSvg.y, startSvg.x, startSvg.y);
    marqueeEl.setAttribute("visibility", "visible");
  }

  function onMove(ev){
    if (ev.pointerId !== pointerId) return;
    var dx = ev.clientX - startClient.x, dy = ev.clientY - startClient.y;
    if (!moved && Math.hypot(dx,dy) > 4) moved = true;
    if (!moved) return;
    if (doMarquee){
      var cur = screenToSvg(ev.clientX, ev.clientY);
      updateMarqueeRect(startSvg.x, startSvg.y, cur.x, cur.y);
    } else if (!pendingAdd){
      var r = stageEl.getBoundingClientRect();
      view.x = startView.x - dx * (view.w / r.width);
      view.y = startView.y - dy * (view.h / r.height);
      applyViewBox();
    }
  }
  function onUp(ev){
    if (ev && ev.pointerId !== pointerId) return;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    if (doMarquee) marqueeEl.setAttribute("visibility", "hidden");
    if (!moved){
      if (pendingAdd){
        var pt = screenToSvg(ev.clientX, ev.clientY);
        if (snapToGrid && !ev.altKey){ pt = { x: snapValue(pt.x), y: snapValue(pt.y) }; }
        // Soltar o triângulo de Generalização em cima de uma entidade existente não cria um
        // triângulo solto — pergunta quantas subclasses criar e monta a hierarquia inteira (ver
        // placeGeneralizationOnEntity). Soltar em qualquer outro lugar continua criando só o
        // triângulo vazio, como antes.
        if (pendingAdd.type === "generalization"){
          pendingAdd = null;
          render();
          handleGeneralizationDrop(pt);
          return;
        }
        var opts = {};
        if (pendingAdd.type === "entity") opts.weak = !!pendingAdd.weak;
        if (pendingAdd.type === "relationship") opts.identifying = !!pendingAdd.identifying;
        if (pendingAdd.type === "attribute") opts.attrKind = pendingAdd.kind || "simple";
        if (pendingAdd.type === "note") opts.runs = [[{ text:"Escreva sua anotação aqui...", bold:false, italic:false, underline:false, fontSize:12 }]];
        if (pendingAdd.type === "table") opts.columns = [{ name:"id", dataType:"INT", pk:true, fk:false, fkTable:null, fkColumn:null }];
        var n = addNodeAt(pendingAdd.type, opts, pt.x, pt.y);
        pendingAdd = null;
        selectedNodeIds = new Set([n.id]);
        selectedEdgeIds = new Set();
        render();
      } else if (connectMode){
        connectFrom = null;
        render();
      } else {
        if (selectedNodeIds.size || selectedEdgeIds.size){ selectedNodeIds.clear(); selectedEdgeIds.clear(); render(); }
      }
    } else if (doMarquee){
      var cur = screenToSvg(ev.clientX, ev.clientY);
      applyMarqueeSelection(startSvg.x, startSvg.y, cur.x, cur.y, ev.shiftKey);
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
});

stageEl.addEventListener("wheel", function(e){
  e.preventDefault();
  var pt = screenToSvg(e.clientX, e.clientY);

}, { passive:false });

document.addEventListener("keydown", function(e){
  var ae = document.activeElement;
  var tag = (ae && ae.tagName) || "";
  // isContentEditable cobre a caixa de texto rica da anotação — sem essa checagem, Delete/Backspace
  // digitados para apagar um caractere dentro do texto acabavam excluindo a anotação inteira
  // (já que ela fica selecionada enquanto seu painel de edição está aberto).
  var inField = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" || (ae && ae.isContentEditable);
  if (e.key === "Escape"){
    if (connectMode){ connectMode = false; connectFrom = null; }
    else if (pendingAdd){ pendingAdd = null; }
    else { selectedNodeIds.clear(); selectedEdgeIds.clear(); }
    render();
  } else if ((e.key === "Delete" || e.key === "Backspace") && !inField && (selectedNodeIds.size || selectedEdgeIds.size)){
    e.preventDefault();
    deleteSelection();
  } else if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "c" || e.key === "C") && !inField){
    // Fora de um campo de texto, Ctrl+C (ou Cmd+C no Mac) copia os elementos selecionados do
    // diagrama; dentro de um campo, o atalho continua copiando texto normalmente (não interceptado).
    e.preventDefault();
    copySelection();
  } else if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "v" || e.key === "V") && !inField){
    e.preventDefault();
    pasteClipboard();
  }
});
