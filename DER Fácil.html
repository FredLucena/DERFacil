/* ---------- edição de texto rico da anotação ---------- */
// A caixa de texto da anotação é um <div contenteditable> — permite selecionar um trecho do
// texto e aplicar tamanho/negrito/itálico/sublinhado só a ele, em vez de formatar a caixa toda.
var currentNoteEditorEl = null;   // o <div contenteditable> atualmente exibido no painel (ou null)
var noteSelRange = null;          // último Range de seleção do usuário dentro do editor (clonado)

document.execCommand && document.execCommand("defaultParagraphSeparator", false, "div");

document.addEventListener("selectionchange", function(){
  if (!currentNoteEditorEl || !document.body.contains(currentNoteEditorEl)) return;
  if (document.activeElement !== currentNoteEditorEl) return;
  var sel = window.getSelection();
  if (sel && sel.rangeCount) noteSelRange = sel.getRangeAt(0).cloneRange();
  updateNoteToolbarState(currentNoteEditorEl);
});

function runToStyleAttr(r){
  return "font-weight:" + (r.bold ? "700" : "400") + ";font-style:" + (r.italic ? "italic" : "normal") +
    ";text-decoration:" + (r.underline ? "underline" : "none") + ";font-size:" + (r.fontSize || 12) + "px";
}
function runsToHtml(paragraphs){
  var paras = (paragraphs && paragraphs.length) ? paragraphs : [[]];
  return paras.map(function(runs){
    if (!runs || !runs.length) return "<div><br></div>";
    return "<div>" + runs.map(function(r){
      return '<span style="' + runToStyleAttr(r) + '">' + escapeHtml(r.text) + "</span>";
    }).join("") + "</div>";
  }).join("");
}

// Lê o estilo "efetivo" de um elemento (resolvendo negrito/itálico/sublinhado/tamanho herdados
// de spans aninhados, produzidos pelo próprio execCommand do navegador) via getComputedStyle —
// assim não importa como o navegador organizou o DOM internamente ao aplicar a formatação.
function computeNoteStyleFromEl(el, root){
  var cs = window.getComputedStyle(el);
  var weight = parseInt(cs.fontWeight, 10);
  var bold = isFinite(weight) ? weight >= 600 : /bold/.test(cs.fontWeight);
  var italic = cs.fontStyle === "italic";
  var fontSize = Math.round(parseFloat(cs.fontSize)) || 12;
  // text-decoration NÃO é uma propriedade herdada em CSS — o computed style de um elemento
  // filho não "enxerga" o sublinhado aplicado num ancestral, embora o navegador desenhe a
  // linha atravessando os filhos mesmo assim (é pintada pelo ancestral, não herdada). Por isso,
  // ao contrário de negrito/itálico/tamanho (que herdam normalmente e já vêm resolvidos no
  // computed style do elemento mais interno), é preciso subir manualmente pelos ancestrais até
  // a caixa de edição, checando o texto-decoration de cada um.
  var underline = false;
  var cur = el;
  while (cur && cur.nodeType === 1){
    var d = window.getComputedStyle(cur);
    var deco = d.textDecorationLine || d.textDecoration || "";
    if (deco.indexOf("underline") !== -1){ underline = true; break; }
    if (cur === root) break;
    cur = cur.parentElement;
  }
  return { bold:bold, italic:italic, underline:underline, fontSize:fontSize };
}
// Percorre o DOM da caixa editável e reconstrói node.runs (parágrafos de trechos formatados) —
// cada <div>/<p> vira um parágrafo novo; qualquer outro elemento (span, b, i, u, font...) só é
// "atravessado" sem quebrar o parágrafo; <br> é ignorado (serve só para manter um <div> vazio
// clicável, já que Enter sempre cria um novo <div> — ver defaultParagraphSeparator acima).
function parseEditorToRuns(editorEl){
  var paragraphs = [];
  var curRuns = [];
  function pushRun(text, style){
    if (!text) return;
    var last = curRuns[curRuns.length - 1];
    if (last && last.bold === style.bold && last.italic === style.italic && last.underline === style.underline && last.fontSize === style.fontSize){
      last.text += text;
    } else {
      curRuns.push({ text:text, bold:style.bold, italic:style.italic, underline:style.underline, fontSize:style.fontSize });
    }
  }
  function walk(node){
    if (node.nodeType === 3){ pushRun(node.nodeValue, computeNoteStyleFromEl(node.parentElement || editorEl, editorEl)); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName;
    if (tag === "BR") return;
    if (tag === "DIV" || tag === "P"){
      Array.prototype.forEach.call(node.childNodes, walk);
      paragraphs.push(curRuns);
      curRuns = [];
      return;
    }
    Array.prototype.forEach.call(node.childNodes, walk);
  }
  Array.prototype.forEach.call(editorEl.childNodes, walk);
  if (curRuns.length || paragraphs.length === 0) paragraphs.push(curRuns);
  return paragraphs;
}

// Reaplica o último Range selecionado pelo usuário dentro do editor — necessário porque clicar
// num botão do painel (fora do contenteditable) tira o foco da caixa de texto, o que faria o
// navegador perder a seleção antes do execCommand ser executado.
function restoreNoteSelection(editorEl){
  editorEl.focus();
  if (noteSelRange){
    try { var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(noteSelRange); } catch (err){ /* seleção já não é mais válida */ }
  }
}
function syncNoteFromEditor(n, editorEl){
  n.runs = parseEditorToRuns(editorEl);
  n.text = runsToPlainText(n.runs);
  redrawStage();
  scheduleAutosave();
}
function applyNoteInlineCmd(n, editorEl, cmd){
  restoreNoteSelection(editorEl);
  document.execCommand("styleWithCSS", false, true);
  document.execCommand(cmd);
  syncNoteFromEditor(n, editorEl);
  updateNoteToolbarState(editorEl);
}
function applyNoteFontSize(n, editorEl, px){
  px = clamp(Math.round(Number(px)) || 12, NOTE_FONT_MIN, NOTE_FONT_MAX);
  restoreNoteSelection(editorEl);
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.getRangeAt(0).collapsed){
    showToast("Selecione um trecho do texto da anotação para mudar o tamanho da fonte dele.");
    return;
  }
  // "styleWithCSS" precisa estar DESLIGADO aqui: com ele ligado, o Chrome aplica o tamanho
  // "7" diretamente como font-size (num valor fixo do navegador, nada a ver com o px desejado)
  // em vez de criar a tag <font size="7"> que o trique abaixo espera encontrar e substituir.
  document.execCommand("styleWithCSS", false, false);
  // Trique padrão para tamanho de fonte em px arbitrário num contenteditable: o navegador só
  // aceita a escala legada 1-7 no execCommand("fontSize"), então marcamos o trecho com o
  // tamanho-sentinela 7 e trocamos pelo px desejado logo em seguida.
  document.execCommand("fontSize", false, "7");
  Array.prototype.forEach.call(editorEl.querySelectorAll('font[size="7"]'), function(f){
    f.removeAttribute("size");
    f.style.fontSize = px + "px";
  });
  syncNoteFromEditor(n, editorEl);
  updateNoteToolbarState(editorEl);
}
function updateNoteToolbarState(editorEl){
  var boldBtn = document.getElementById("pf-note-bold");
  var italicBtn = document.getElementById("pf-note-italic");
  var underlineBtn = document.getElementById("pf-note-underline");
  var sizeInput = document.getElementById("pf-note-size");
  if (!boldBtn || !italicBtn || !underlineBtn) return;
  var bold = false, italic = false, underline = false, size = 12;
  try {
    bold = document.queryCommandState("bold");
    italic = document.queryCommandState("italic");
    underline = document.queryCommandState("underline");
  } catch (err){ /* comando indisponível neste navegador — mantém os padrões */ }
  var sel = window.getSelection();
  if (sel && sel.anchorNode){
    var el = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    if (el && editorEl.contains(el)) size = Math.round(parseFloat(window.getComputedStyle(el).fontSize)) || 12;
  }
  boldBtn.classList.toggle("active", bold);
  italicBtn.classList.toggle("active", italic);
  underlineBtn.classList.toggle("active", underline);
  if (sizeInput && document.activeElement !== sizeInput) sizeInput.value = size;
}

/* ---------- painel de propriedades ---------- */

// Painel de edição de uma tabela do modelo lógico: nome da tabela e a lista de colunas (nome,
// tipo, PK, FK — com seletor de tabela/coluna referenciada quando FK está marcado). Cada edição
// reconstrói o painel inteiro (mesmo padrão já usado para nome de entidade/papel de conexão),
// então cada input, ao terminar de digitar, refoca a si mesmo e restaura a posição do cursor.
function renderTablePanel(n){
  var html = '<h3>' + escapeHtml(n.name || "Tabela") + '</h3><div class="kind">Tabela</div>';
  html += '<div class="field"><label for="pf-table-name">Nome da tabela</label><input type="text" id="pf-table-name" value="' + escapeHtml(n.name) + '"></div>';
  html += '<div class="field"><label>Colunas</label><div class="col-list">';
  var otherTables = state.nodes.filter(function(t){ return t.type === "table" && t.id !== n.id; });
  (n.columns || []).forEach(function(c, i){
    html += '<div class="col-row">';
    html += '<input type="text" class="col-name" data-i="' + i + '" value="' + escapeHtml(c.name) + '" placeholder="nome">';
    // O tipo (e o tamanho) de uma coluna FK nunca são digitados diretamente — eles sempre
    // espelham o tipo/tamanho da coluna referenciada (ver
    // syncColumnDataTypeFromReference/syncForeignKeysForColumnChange), então os dois campos ficam
    // desabilitados; para mudá-los, altere o tipo da PK relacionada. A lista de tipos vem dos
    // tipos cadastrados em "Gerenciar tipos" — se a coluna já usa um tipo que não está mais
    // cadastrado (foi excluído da lista, ou veio de um projeto salvo em outro navegador), ele
    // ainda aparece como opção extra, para não trocar o valor da coluna sem o usuário pedir.
    var typeOptions = customDataTypes.slice();
    if (c.dataType && typeOptions.indexOf(c.dataType) === -1){ typeOptions.push(c.dataType); sortDataTypes(typeOptions); }
    var fkTypeAttrs = c.fk ? ' disabled title="O tipo de uma chave estrangeira acompanha automaticamente o tipo da chave primária referenciada — altere o tipo lá para mudar este."' : '';
    html += '<select class="col-type-base" data-i="' + i + '"' + fkTypeAttrs + '>' + typeOptions.map(function(t){
      return '<option value="' + escapeHtml(t) + '"' + (c.dataType === t ? " selected" : "") + '>' + escapeHtml(t) + '</option>';
    }).join("") + '</select>';
    html += '<input type="text" class="col-type-size" data-i="' + i + '" value="' + escapeHtml(c.dataSize || "") + '" placeholder="tam."' + fkTypeAttrs + '>';
    html += '<label class="col-flag" title="Chave primária"><input type="checkbox" class="col-pk" data-i="' + i + '" ' + (c.pk ? "checked" : "") + '> PK</label>';
    html += '<label class="col-flag" title="Chave estrangeira"><input type="checkbox" class="col-fk" data-i="' + i + '" ' + (c.fk ? "checked" : "") + '> FK</label>';
    html += '<button type="button" class="col-del" data-i="' + i + '" title="Remover coluna">×</button>';
    html += '</div>';
    if (c.fk){
      html += '<div class="col-fk-refs">';
      if (otherTables.length){
        html += '<select class="col-fk-table" data-i="' + i + '">' + otherTables.map(function(t){
          return '<option value="' + t.id + '"' + (c.fkTable === t.id ? " selected" : "") + '>' + escapeHtml(t.name) + '</option>';
        }).join("") + '</select>';
        var refTable = getNode(c.fkTable) || otherTables[0];
        var refCols = (refTable && refTable.columns) || [];
        html += '<select class="col-fk-column" data-i="' + i + '">' + refCols.map(function(rc){
          return '<option value="' + escapeHtml(rc.name) + '"' + (c.fkColumn === rc.name ? " selected" : "") + '>' + escapeHtml(rc.name) + '</option>';
        }).join("") + '</select>';
      } else {
        html += '<span class="hint">Crie outra tabela com uma coluna PK para referenciar.</span>';
      }
      html += '</div>';
    }
  });
  html += '</div><button type="button" class="hbtn" id="pf-col-add" style="margin-top:8px;width:100%;justify-content:center;">+ Adicionar coluna</button></div>';
  html += '<p class="hint">Tabela do modelo lógico — use "Conectar" na barra à esquerda para ligar duas tabelas e criar automaticamente uma coluna FK, ou marque FK numa coluna aqui e escolha a tabela/coluna referenciada. O tipo de uma coluna FK acompanha sempre o tipo da chave primária referenciada e só muda a partir dela.</p>';
  html += '<button class="danger-btn" id="pf-delete">Excluir tabela</button>';
  panelEl.innerHTML = html;

  function refocus(sel, i, cursorEnd){
    var el = panelEl.querySelector(sel + '[data-i="' + i + '"]');
    if (el){ el.focus(); if (cursorEnd !== undefined) el.setSelectionRange(cursorEnd, cursorEnd); }
  }
  document.getElementById("pf-table-name").addEventListener("input", function(e){
    n.name = e.target.value; render();
    var el = document.getElementById("pf-table-name");
    if (el){ el.focus(); el.setSelectionRange(e.target.value.length, e.target.value.length); }
  });
  panelEl.querySelectorAll(".col-name").forEach(function(inp){
    inp.addEventListener("input", function(e){
      var i = Number(inp.getAttribute("data-i"));
      var col = n.columns[i];
      var oldName = col.name;
      var newName = e.target.value;
      col.name = newName;
      // Se outra(s) coluna(s) FK (nesta ou em qualquer outra tabela) referenciam esta coluna pelo
      // nome antigo, elas precisam acompanhar o novo nome — senão ficam apontando para uma coluna
      // que não existe mais.
      syncForeignKeysForColumnChange(n, oldName, newName, null, null);
      render();
      refocus(".col-name", i, e.target.value.length);
    });
  });
  panelEl.querySelectorAll(".col-type-base").forEach(function(sel){
    sel.addEventListener("change", function(e){
      var i = Number(sel.getAttribute("data-i"));
      var col = n.columns[i];
      // Coluna FK: o campo já vem desabilitado no HTML (o tipo só muda a partir da PK
      // referenciada), então este listener nunca deveria disparar para ela — a checagem aqui é
      // só uma segunda trava de segurança.
      if (col.fk) return;
      col.dataType = e.target.value;
      // O tipo (e o tamanho atual) de uma coluna FK deve sempre espelhar os da coluna que ela
      // referencia — repassa o par completo, não só o campo que mudou.
      syncForeignKeysForColumnChange(n, col.name, col.name, col.dataType, col.dataSize || "");
      render();
    });
  });
  panelEl.querySelectorAll(".col-type-size").forEach(function(inp){
    inp.addEventListener("input", function(e){
      var i = Number(inp.getAttribute("data-i"));
      var col = n.columns[i];
      if (col.fk) return;
      col.dataSize = e.target.value;
      syncForeignKeysForColumnChange(n, col.name, col.name, col.dataType, col.dataSize || "");
      render();
      refocus(".col-type-size", i, e.target.value.length);
    });
  });
  panelEl.querySelectorAll(".col-pk").forEach(function(chk){
    chk.addEventListener("change", function(e){
      var i = Number(chk.getAttribute("data-i"));
      n.columns[i].pk = e.target.checked; render();
    });
  });
  panelEl.querySelectorAll(".col-fk").forEach(function(chk){
    chk.addEventListener("change", function(e){
      var i = Number(chk.getAttribute("data-i"));
      var col = n.columns[i];
      col.fk = e.target.checked;
      if (col.fk){
        if (!col.fkTable || !getNode(col.fkTable)){
          var others = state.nodes.filter(function(t){ return t.type === "table" && t.id !== n.id; });
          var first = others[0];
          col.fkTable = first ? first.id : null;
          var firstPk = first && (first.columns || []).filter(function(rc){ return rc.pk; })[0];
          col.fkColumn = firstPk ? firstPk.name : (first && first.columns && first.columns[0] ? first.columns[0].name : null);
        }
        syncColumnDataTypeFromReference(col);
      } else {
        col.fkTable = null; col.fkColumn = null;
      }
      render();
    });
  });
  panelEl.querySelectorAll(".col-fk-table").forEach(function(sel){
    sel.addEventListener("change", function(e){
      var i = Number(sel.getAttribute("data-i"));
      var col = n.columns[i];
      col.fkTable = e.target.value;
      var refTable = getNode(col.fkTable);
      var refPk = refTable && (refTable.columns || []).filter(function(rc){ return rc.pk; })[0];
      col.fkColumn = refPk ? refPk.name : (refTable && refTable.columns && refTable.columns[0] ? refTable.columns[0].name : null);
      syncColumnDataTypeFromReference(col);
      render();
    });
  });
  panelEl.querySelectorAll(".col-fk-column").forEach(function(sel){
    sel.addEventListener("change", function(e){
      var i = Number(sel.getAttribute("data-i"));
      var col = n.columns[i];
      col.fkColumn = e.target.value;
      syncColumnDataTypeFromReference(col);
      render();
    });
  });
  panelEl.querySelectorAll(".col-del").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = Number(btn.getAttribute("data-i"));
      n.columns.splice(i, 1); render();
    });
  });
  document.getElementById("pf-col-add").addEventListener("click", function(){
    n.columns.push({ name:"coluna", dataType:"VARCHAR", dataSize:"50", pk:false, fk:false, fkTable:null, fkColumn:null });
    render();
  });
  document.getElementById("pf-delete").addEventListener("click", function(){ deleteNode(n.id); render(); });
}

/* ---------- persistência local ---------- */
// Um projeto salvo agora guarda os dois modelos: { projectName, mode, conceptual, logical }.
// buildProjectSnapshot() empacota o estado atual nesse formato para autosave/exportação.
function buildProjectSnapshot(){
  return { projectName: state.projectName, mode: mode, conceptual: conceptualModel, logical: logicalModel };
}
var autosaveTimer = null;
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function(){
    try {
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(buildProjectSnapshot()));
      var now = new Date();
      autosaveNote.textContent = "salvo neste navegador às " + now.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
    } catch (err){
      autosaveNote.textContent = "";
    }
  }, 450);
}

// Aplica um projeto já no formato novo (com .conceptual e, opcionalmente, .logical) às variáveis
// globais de estado — usada tanto no carregamento inicial (autosave v2) quanto ao abrir um
// arquivo .json exportado por esta mesma versão do app.
function applyLoadedProject(parsedProject){
  mode = (parsedProject.mode === "logical") ? "logical" : "conceptual";
  conceptualModel = normalizeLoadedState(parsedProject.conceptual);
  logicalModel = (parsedProject.logical && Array.isArray(parsedProject.logical.nodes)) ? normalizeLoadedLogicalState(parsedProject.logical) : null;
  if (mode === "logical" && !logicalModel) mode = "conceptual"; // nunca fica em modo lógico sem um modelo lógico
  state = (mode === "logical") ? logicalModel : conceptualModel;
}

function loadInitialState(){
  // formato novo (v2): os dois modelos guardados juntos.
  try {
    var rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if (rawV2){
      var parsedV2 = JSON.parse(rawV2);
      if (parsedV2 && parsedV2.conceptual && Array.isArray(parsedV2.conceptual.nodes)){
        applyLoadedProject(parsedV2);
        return;
      }
    }
  } catch (err){ /* ignora e tenta o formato antigo */ }
  // formato antigo (v1): só o modelo conceitual, salvo antes da Modelagem Lógica existir —
  // preserva diagramas já salvos por versões anteriores do app.
  try {
    var rawV1 = localStorage.getItem(STORAGE_KEY);
    if (rawV1){
      var parsedV1 = JSON.parse(rawV1);
      if (parsedV1 && Array.isArray(parsedV1.nodes) && Array.isArray(parsedV1.edges)){
        mode = "conceptual";
        conceptualModel = normalizeLoadedState(parsedV1);
        logicalModel = null;
        state = conceptualModel;
        return;
      }
    }
  } catch (err){ /* ignora e usa exemplo */ }
  showToast('Exibindo um diagrama de exemplo — clique em "Novo projeto" para começar do zero.');
  mode = "conceptual";
  conceptualModel = buildExampleState();
  logicalModel = null;
  state = conceptualModel;
}

// Migra uma anotação salva para o formato de texto rico (node.runs). Projetos já salvos no
// formato novo (n.runs presente) só passam por uma sanitização defensiva; projetos antigos
// (texto simples + negrito/itálico/sublinhado/tamanho únicos para a caixa toda) viram um único
// trecho (run) por parágrafo, com aquela formatação — assim o diagrama não muda de aparência ao
// abrir um projeto salvo antes desse recurso existir.
function normalizeNoteRuns(n){
  function sanitizeRun(r){
    return {
      text: String((r && r.text) || ""),
      bold: !!(r && r.bold), italic: !!(r && r.italic), underline: !!(r && r.underline),
      fontSize: (r && isFinite(Number(r.fontSize)) && Number(r.fontSize)) ? clamp(Math.round(Number(r.fontSize)), NOTE_FONT_MIN, NOTE_FONT_MAX) : 12
    };
  }
  if (n && Array.isArray(n.runs)){
    var paras = n.runs.map(function(p){
      return Array.isArray(p) ? p.filter(function(r){ return r && typeof r.text === "string" && r.text !== ""; }).map(sanitizeRun) : [];
    });
    return paras.length ? paras : [[]];
  }
  var legacyFontSize = isFinite(Number(n && n.fontSize)) && n.fontSize ? clamp(Math.round(Number(n.fontSize)), NOTE_FONT_MIN, NOTE_FONT_MAX) : 12;
  var legacyStyle = { bold: !!(n && n.bold), italic: !!(n && n.italic), underline: !!(n && n.underline), fontSize: legacyFontSize };
  var paragraphs = String((n && n.text) || "").split("\n");
  return paragraphs.map(function(p){ return p === "" ? [] : [Object.assign({ text:p }, legacyStyle)]; });
}

function normalizeLoadedState(parsed){
  var s = freshState(parsed.projectName || "Modelo Conceitual");
  s.nodes = parsed.nodes.map(function(n){
    var base = Object.assign({
      id: n.id || uid("nd"), type:n.type, name:n.name || "", x:Number(n.x)||0, y:Number(n.y)||0,
      weak: !!n.weak, identifying: !!n.identifying, attrKind: n.attrKind || "simple",
      isKey: !!n.isKey, coverage: n.coverage || "partial", overlap: n.overlap || "disjoint",
      noteW: isFinite(Number(n.noteW)) && n.noteW ? Number(n.noteW) : null,
      noteH: isFinite(Number(n.noteH)) && n.noteH ? Number(n.noteH) : null,
      align: ["left","center","right","justify"].indexOf(n.align) !== -1 ? n.align : "left"
    }, {});
    if (base.type === "note"){
      base.runs = normalizeNoteRuns(n);
      base.text = runsToPlainText(base.runs);
    }
    return base;
  });
  s.edges = parsed.edges.map(function(e){
    return { id: e.id || uid("ed"), from:e.from, to:e.to, kind: e.kind || "plain", min: e.min || "0", max: e.max || "N", role: e.role || "" };
  });
  var maxByType = { entity:0, relationship:0, attribute:0, generalization:0, note:0 };
  s.nodes.forEach(function(n){
    var m = /(\d+)$/.exec(n.name || "");
    if (m && maxByType[n.type] !== undefined) maxByType[n.type] = Math.max(maxByType[n.type], parseInt(m[1],10));
  });
  s.nextIds = { entity:maxByType.entity+1, relationship:maxByType.relationship+1, attribute:maxByType.attribute+1, generalization:maxByType.generalization+1, note:maxByType.note+1 };
  // Migração: projetos salvos antes da convenção attrAnchorV 2 guardavam o CENTRO do atributo
  // simples em x. Desloca para a nova convenção (borda esquerda) para o desenho não "pular"
  // ao abrir um projeto antigo.
  if (parsed.attrAnchorV !== 2){
    s.nodes.forEach(function(n){
      if (isBareAttr(n)) n.x = n.x + computeDims(n).w/2;
    });
  }
  s.attrAnchorV = 2;
  return s;
}

// Sanitiza a cardinalidade (min,max) opcional gravada numa coluna FK gerada pela conversão —
// undefined/null quando a coluna não carrega essa informação (ex.: FK criada manualmente pelo
// "Conectar", que não tem cardinalidade de relacionamento nenhuma para repassar).
function normalizeCard(v){
  if (!v || typeof v !== "object") return null;
  return { min: String(v.min || "0"), max: String(v.max || "N") };
}

// Sanitiza o tipo/tamanho de uma coluna carregada. Projetos salvos ANTES desta funcionalidade
// (tipo e tamanho em campos separados) guardavam o tipo inteiro numa string só, ex.: "VARCHAR(50)"
// — sem um dataSize (formato novo) já presente, tenta separar essa string antiga em tipo base +
// tamanho, para o painel continuar editável normalmente em vez de tratar "VARCHAR(50)" como um
// nome de tipo (inteiro, sem tamanho separável).
function normalizeColumnDataType(c){
  if (c && typeof c.dataSize === "string") return { dataType: String(c.dataType || ""), dataSize: c.dataSize };
  var raw = String((c && c.dataType) || "VARCHAR(50)");
  var m = raw.match(/^(.*?)\((.*)\)\s*$/);
  return m ? { dataType: m[1].trim(), dataSize: m[2].trim() } : { dataType: raw.trim(), dataSize: "" };
}

// Sanitiza um modelo lógico carregado (autosave v2 ou arquivo .json). As arestas nunca são lidas
// do arquivo — são sempre recalculadas a partir das colunas FK (rebuildLogicalEdges), então
// basta reconstruir os nós (tabelas e eventuais anotações).
function normalizeLoadedLogicalState(parsed){
  var s = freshLogicalState(parsed.projectName || "Modelo Conceitual");
  s.nodes = (parsed.nodes || []).map(function(n){
    if (n.type === "table"){
      return {
        id: n.id || uid("nd"), type:"table", name: n.name || "Tabela",
        x: Number(n.x) || 0, y: Number(n.y) || 0,
        columns: Array.isArray(n.columns) ? n.columns.map(function(c){
          var dt = normalizeColumnDataType(c);
          return {
            name: String((c && c.name) || "campo"),
            dataType: dt.dataType,
            dataSize: dt.dataSize,
            pk: !!(c && c.pk), fk: !!(c && c.fk),
            fkTable: (c && c.fkTable) || null, fkColumn: (c && c.fkColumn) || null,
            cardChild: normalizeCard(c && c.cardChild),
            cardParent: normalizeCard(c && c.cardParent)
          };
        }) : []
      };
    }
    if (n.type === "note"){
      var base = {
        id: n.id || uid("nd"), type:"note", name: n.name || "", x:Number(n.x)||0, y:Number(n.y)||0,
        noteW: isFinite(Number(n.noteW)) && n.noteW ? Number(n.noteW) : null,
        noteH: isFinite(Number(n.noteH)) && n.noteH ? Number(n.noteH) : null,
        align: ["left","center","right","justify"].indexOf(n.align) !== -1 ? n.align : "left"
      };
      base.runs = normalizeNoteRuns(n);
      base.text = runsToPlainText(base.runs);
      return base;
    }
    return null;
  }).filter(Boolean);
  s.edges = [];
  var maxByType = { table:0, note:0 };
  s.nodes.forEach(function(n){
    var m = /(\d+)$/.exec(n.name || "");
    if (m && maxByType[n.type] !== undefined) maxByType[n.type] = Math.max(maxByType[n.type], parseInt(m[1],10));
  });
  s.nextIds = { table:maxByType.table+1, note:maxByType.note+1 };
  return s;
}

/* ---------- modelagem lógica: conversão e edição ---------- */
function slugColumnName(name){
  return String(name || "campo").trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "_").replace(/(^_|_$)/g, "") || "campo";
}

// Posiciona as tabelas geradas numa grade simples (ordem em que foram criadas), já que suas
// caixas são bem maiores que os nós conceituais de origem e reaproveitar as coordenadas antigas
// deixaria tudo sobreposto. O usuário pode reorganizar arrastando depois.
function autoLayoutTables(nodes){
  var margin = 60, cols = Math.max(1, Math.ceil(Math.sqrt(nodes.length)));
  var curX = 100, curY = 100, maxHInRow = 0, countInRow = 0;
  nodes.forEach(function(n){
    var d = computeDims(n);
    if (countInRow >= cols){ curX = 100; curY += maxHInRow + margin; maxHInRow = 0; countInRow = 0; }
    n.x = curX + d.w/2;
    n.y = curY + d.h/2;
    curX += d.w + margin;
    maxHInRow = Math.max(maxHInRow, d.h);
    countInRow++;
  });
}

// Converte o modelo conceitual (DER em notação Chen) num rascunho do modelo lógico (tabelas),
// seguindo as regras de mapeamento padrão ensinadas em cursos introdutórios de Banco de Dados
// (ex.: Heuser, "Projeto de Banco de Dados"):
//  - cada entidade (forte ou fraca) vira uma tabela; atributos simples viram colunas; atributos
//    compostos são "achatados" (os sub-atributos viram colunas direto na tabela do dono);
//  - atributo multivalorado vira uma tabela à parte, com FK para a tabela dona;
//  - entidade fraca: sua tabela ganha, além da própria chave parcial, uma coluna FK para a PK da
//    entidade forte da qual depende — e essa FK também entra na chave primária (chave composta);
//  - generalização/especialização: uma tabela por subtipo — a subclasse herda a mesma PK da
//    superclasse, que é ao mesmo tempo FK para a tabela da superclasse;
//  - relacionamento 1:1 ou 1:N: FK na tabela do lado "N" (ou, em 1:1, na primeira entidade,
//    por convenção) referenciando a PK do outro lado; atributos do relacionamento viram colunas
//    dessa mesma tabela;
//  - relacionamento N:N: vira uma tabela associativa própria, com FK para as duas entidades
//    (chave primária composta) e os atributos do relacionamento como colunas extras.
// Casos fora desse escopo (relacionamentos não-binários, por exemplo) são ignorados de forma
// defensiva em vez de quebrar a conversão — o usuário pode sempre completar à mão depois.
function convertConceptualToLogical(conceptual){
  var logical = freshLogicalState(conceptual.projectName);
  function getConceptNode(id){
    for (var i=0;i<conceptual.nodes.length;i++){ if (conceptual.nodes[i].id === id) return conceptual.nodes[i]; }
    return null;
  }
  var entities = conceptual.nodes.filter(function(n){ return n.type === "entity"; });
  var relationships = conceptual.nodes.filter(function(n){ return n.type === "relationship"; });
  var attributes = conceptual.nodes.filter(function(n){ return n.type === "attribute"; });
  var generalizations = conceptual.nodes.filter(function(n){ return n.type === "generalization"; });

  // Dono direto de cada atributo (entidade, relacionamento ou outro atributo, no caso de
  // sub-atributos de um composto). Um atributo composto tem ligações tanto com seu "dono" quanto
  // com seus próprios sub-atributos — não dá pra distinguir só olhando as duas pontas de uma
  // ligação, então é preciso caminhar pela árvore a partir das entidades/relacionamentos (as
  // raízes) para não confundir "pai" com "filho" nesse caso.
  var adjByNode = {};
  conceptual.edges.forEach(function(e){
    if (e.kind !== "plain") return;
    (adjByNode[e.from] = adjByNode[e.from] || []).push(e.to);
    (adjByNode[e.to] = adjByNode[e.to] || []).push(e.from);
  });
  var attrParent = {};
  function visitAttrsFrom(rootId){
    var frontier = (adjByNode[rootId] || []).filter(function(id){
      var n = getConceptNode(id);
      return n && n.type === "attribute" && attrParent[id] === undefined;
    });
    frontier.forEach(function(id){ attrParent[id] = rootId; });
    while (frontier.length){
      var cur = frontier.shift();
      (adjByNode[cur] || []).forEach(function(nid){
        if (nid === attrParent[cur]) return; // não volta para o próprio pai
        var nnode = getConceptNode(nid);
        if (!nnode || nnode.type !== "attribute" || attrParent[nid] !== undefined) return;
        attrParent[nid] = cur;
        frontier.push(nid);
      });
    }
  }
  entities.forEach(function(e){ visitAttrsFrom(e.id); });
  relationships.forEach(function(r){ visitAttrsFrom(r.id); });
  function ownAttrsOf(nodeId){ return attributes.filter(function(a){ return attrParent[a.id] === nodeId; }); }

  function columnsForAttr(attrNode){
    if (attrNode.attrKind === "multivalued") return []; // vira tabela à parte (ver abaixo)
    if (attrNode.attrKind === "composite"){
      var cols = [];
      ownAttrsOf(attrNode.id).forEach(function(k){ cols = cols.concat(columnsForAttr(k)); });
      return cols;
    }
    return [{ name: slugColumnName(attrNode.name), dataType:"VARCHAR", dataSize:"50", pk: !!attrNode.isKey, fk:false, fkTable:null, fkColumn:null }];
  }

  function participantsOf(relId){
    var res = [];
    conceptual.edges.forEach(function(e){
      if (e.kind !== "participation") return;
      var otherId = e.from === relId ? e.to : (e.to === relId ? e.from : null);
      if (!otherId) return;
      var other = getConceptNode(otherId);
      if (other && other.type === "entity") res.push({ edge:e, entity:other });
    });
    return res;
  }
  // Retorna { ownerPart, weakPart } (cada um com .entity e .edge, este último trazendo a
  // cardinalidade (min,max) que o usuário definiu no relacionamento identificador) — usada tanto
  // para achar a entidade dona quanto, agora, para repassar essa cardinalidade ao modelo lógico.
  function findIdentifyingRelInfo(weakEntity){
    for (var i=0;i<relationships.length;i++){
      var r = relationships[i];
      if (!r.identifying) continue;
      var parts = participantsOf(r.id);
      var weakPart = parts.filter(function(p){ return p.entity.id === weakEntity.id; })[0];
      if (!weakPart) continue;
      var ownerPart = parts.filter(function(p){ return p.entity.id !== weakEntity.id; })[0];
      if (ownerPart) return { ownerPart:ownerPart, weakPart:weakPart };
    }
    return null;
  }

  // Passo 1: uma tabela por entidade, com as colunas dos seus atributos próprios (não os
  // herdados de generalização nem os de entidade fraca, tratados nos passos seguintes).
  var tableByEntityId = {};
  entities.forEach(function(e){
    var t = { id: uid("nd"), type:"table", name: e.name || "Tabela", x: e.x, y: e.y, columns: [] };
    ownAttrsOf(e.id).forEach(function(a){ t.columns = t.columns.concat(columnsForAttr(a)); });
    tableByEntityId[e.id] = t;
    logical.nodes.push(t);
  });

  // Passo 2: entidade fraca — FK (que também é PK) para a entidade da qual depende.
  entities.filter(function(e){ return e.weak; }).forEach(function(e){
    var relInfo = findIdentifyingRelInfo(e);
    var owner = relInfo && relInfo.ownerPart.entity;
    var ownerTable = owner && tableByEntityId[owner.id];
    var childTable = tableByEntityId[e.id];
    if (!ownerTable || !childTable) return;
    var ownerPks = ownerTable.columns.filter(function(c){ return c.pk; });
    if (!ownerPks.length) return;
    // Cardinalidade herdada do relacionamento identificador original — a mesma que aparecia nas
    // pílulas (min,max) do diagrama conceitual, agora nas duas pontas da FK no modelo lógico.
    var cardChild = { min: relInfo.weakPart.edge.min || "0", max: relInfo.weakPart.edge.max || "N" };
    var cardParent = { min: relInfo.ownerPart.edge.min || "0", max: relInfo.ownerPart.edge.max || "N" };
    var fkCols = ownerPks.map(function(pk){
      return { name: slugColumnName(ownerTable.name) + "_" + pk.name, dataType: pk.dataType, dataSize: pk.dataSize, pk:true, fk:true, fkTable: ownerTable.id, fkColumn: pk.name, cardChild:cardChild, cardParent:cardParent };
    });
    childTable.columns = childTable.columns.concat(fkCols);
  });

  // Passo 3: generalização/especialização — uma tabela por subtipo. Se a subclasse (a entidade
  // mais "abaixo" no diagrama) não tem chave própria, ela herda a mesma PK da superclasse (a mais
  // "acima"), que também funciona como FK. Se a subclasse JÁ tem uma chave própria (ex.: CPF numa
  // entidade PessoaFisica, CNPJ numa PessoaJuridica) essa chave própria continua sendo a PK da
  // tabela — nesse caso a PK da superclasse entra só como FK (chave estrangeira comum, não PK).
  generalizations.forEach(function(g){
    var connectedIds = [];
    conceptual.edges.forEach(function(e){
      if (e.from === g.id) connectedIds.push(e.to); else if (e.to === g.id) connectedIds.push(e.from);
    });
    var connectedEntities = connectedIds.map(getConceptNode).filter(function(n){ return n && n.type === "entity"; });
    if (connectedEntities.length < 2) return;
    connectedEntities.sort(function(a,b){ return a.y - b.y; });
    var superE = connectedEntities[0];
    var subEs = connectedEntities.slice(1);
    var superTable = tableByEntityId[superE.id];
    if (!superTable) return;
    var superPks = superTable.columns.filter(function(c){ return c.pk; });
    if (!superPks.length) return;
    // Cardinalidade estrutural da generalização (não vem de nenhuma pílula editável pelo usuário,
    // é sempre a mesma por construção). cardChild fica perto da SUBCLASSE (quem tem a FK): cada
    // instância da superclasse tem no máximo uma linha NESTA subclasse específica — daí (0,1),
    // mesmo quando a cobertura é total (pois "total" garante presença em alguma subclasse, não
    // necessariamente nesta). cardParent fica perto da SUPERCLASSE: cada linha da subclasse
    // referencia exatamente uma superclasse — daí (1,1).
    var genCardChild = { min:"0", max:"1" };
    var genCardParent = { min:"1", max:"1" };
    subEs.forEach(function(subE){
      var subTable = tableByEntityId[subE.id];
      if (!subTable) return;
      var hasOwnKey = subTable.columns.some(function(c){ return c.pk; });
      var inheritedFk = superPks.map(function(pk){
        return { name: pk.name, dataType: pk.dataType, dataSize: pk.dataSize, pk: !hasOwnKey, fk:true, fkTable: superTable.id, fkColumn: pk.name, cardChild:genCardChild, cardParent:genCardParent };
      });
      subTable.columns = subTable.columns.concat(inheritedFk);
    });
  });

  // Passo 4: atributo multivalorado — tabela própria, com FK para a PK da tabela dona.
  attributes.filter(function(a){ return a.attrKind === "multivalued"; }).forEach(function(a){
    var ownerTable = tableByEntityId[attrParent[a.id]];
    if (!ownerTable) return;
    var ownerPks = ownerTable.columns.filter(function(c){ return c.pk; });
    if (!ownerPks.length) return;
    var mvTable = { id: uid("nd"), type:"table", name: ownerTable.name + "_" + a.name, x:a.x, y:a.y, columns: [] };
    mvTable.columns.push({ name: slugColumnName(a.name), dataType:"VARCHAR", dataSize:"50", pk:true, fk:false, fkTable:null, fkColumn:null });
    // Cardinalidade estrutural: cada linha da tabela de valores pertence a exatamente um dono
    // (1,1); o dono pode ter de zero a N valores desse atributo multivalorado (0,N).
    var mvCardChild = { min:"1", max:"1" };
    var mvCardParent = { min:"0", max:"N" };
    ownerPks.forEach(function(pk){
      mvTable.columns.push({ name: slugColumnName(ownerTable.name) + "_" + pk.name, dataType: pk.dataType, dataSize: pk.dataSize, pk:true, fk:true, fkTable: ownerTable.id, fkColumn: pk.name, cardChild:mvCardChild, cardParent:mvCardParent });
    });
    logical.nodes.push(mvTable);
  });

  // Passo 5: relacionamentos binários não-identificadores — FK (1:1 / 1:N) ou tabela associativa (N:N).
  relationships.filter(function(r){ return !r.identifying; }).forEach(function(r){
    var parts = participantsOf(r.id);
    if (parts.length !== 2) return; // só relacionamentos binários são mapeados automaticamente
    var pa = parts[0], pb = parts[1];
    var tableA = tableByEntityId[pa.entity.id], tableB = tableByEntityId[pb.entity.id];
    if (!tableA || !tableB) return;
    var relCols = [];
    ownAttrsOf(r.id).forEach(function(a){ relCols = relCols.concat(columnsForAttr(a)); });
    var maxA = pa.edge.max, maxB = pb.edge.max;
    if (maxA === "N" && maxB === "N"){
      var pkA = tableA.columns.filter(function(c){ return c.pk; });
      var pkB = tableB.columns.filter(function(c){ return c.pk; });
      if (!pkA.length || !pkB.length) return;
      // O nome da tabela associativa é sempre composto pelos nomes das duas tabelas que ela
      // associa, separados por "_" (ex.: Pedido + Produto -> "Pedido_Produto") — mesmo quando o
      // relacionamento original tinha um nome próprio (ex.: "contém") — para deixar claro, só
      // pelo nome, quais tabelas ela liga.
      var junction = { id: uid("nd"), type:"table", name: tableA.name + "_" + tableB.name, x:r.x, y:r.y, columns: [] };
      // Cada linha da tabela associativa referencia exatamente uma linha de cada lado — perto da
      // ENTIDADE (a ponta mais afastada da associativa) a cardinalidade é sempre (1,1), porque uma
      // linha de A ou B sempre corresponde a exatamente uma linha da associativa daquele lado.
      // Perto da ASSOCIATIVA (a ponta mais próxima dela) entra a cardinalidade que o OUTRO lado
      // tinha no relacionamento N:N original: "para um A fixo, quantos B" (cardB, a pílula que
      // ficava junto de B no conceitual) é o mesmo que "para um A fixo, quantas linhas da
      // associativa" — por isso ela aparece na ponta que liga a associativa a A, e vice-versa.
      var entityCardConst = { min:"1", max:"1" };
      var cardA = { min: pa.edge.min || "0", max: pa.edge.max || "N" };
      var cardB = { min: pb.edge.min || "0", max: pb.edge.max || "N" };
      // A chave composta (as duas FKs que juntas formam a PK da associativa) vem sempre no
      // início da tabela; os atributos próprios do relacionamento (quando existem) vêm depois.
      pkA.forEach(function(pk){ junction.columns.push({ name: slugColumnName(tableA.name) + "_" + pk.name, dataType:pk.dataType, dataSize:pk.dataSize, pk:true, fk:true, fkTable:tableA.id, fkColumn:pk.name, cardChild:cardB, cardParent:entityCardConst }); });
      pkB.forEach(function(pk){ junction.columns.push({ name: slugColumnName(tableB.name) + "_" + pk.name, dataType:pk.dataType, dataSize:pk.dataSize, pk:true, fk:true, fkTable:tableB.id, fkColumn:pk.name, cardChild:cardA, cardParent:entityCardConst }); });
      junction.columns = junction.columns.concat(relCols);
      logical.nodes.push(junction);
    } else {
      var manySide, oneSide, manySideEdge, oneSideEdge;
      if (maxA === "N" && maxB !== "N"){ manySide = tableA; oneSide = tableB; manySideEdge = pa.edge; oneSideEdge = pb.edge; }
      else if (maxB === "N" && maxA !== "N"){ manySide = tableB; oneSide = tableA; manySideEdge = pb.edge; oneSideEdge = pa.edge; }
      else { manySide = tableA; oneSide = tableB; manySideEdge = pa.edge; oneSideEdge = pb.edge; } // 1:1 — FK na primeira tabela, por convenção
      var pkOne = oneSide.columns.filter(function(c){ return c.pk; });
      if (!pkOne.length) return;
      relCols.forEach(function(c){ manySide.columns.push(c); });
      // Repassa a cardinalidade (min,max) que o usuário definiu em cada ponta do relacionamento
      // original — a mesma pílula do diagrama conceitual, agora nas duas pontas da FK.
      var relCardChild = { min: manySideEdge.min || "0", max: manySideEdge.max || "N" };
      var relCardParent = { min: oneSideEdge.min || "0", max: oneSideEdge.max || "N" };
      pkOne.forEach(function(pk){
        var colName = slugColumnName(oneSide.name) + "_" + pk.name;
        if (manySide.columns.some(function(c){ return c.name === colName; })) return;
        manySide.columns.push({ name:colName, dataType:pk.dataType, dataSize:pk.dataSize, pk:false, fk:true, fkTable:oneSide.id, fkColumn:pk.name, cardChild:relCardChild, cardParent:relCardParent });
      });
    }
  });

  autoLayoutTables(logical.nodes);
  return logical;
}

/* ---------- projeto: novo / abrir / baixar ---------- */
document.getElementById("btnNew").addEventListener("click", async function(){
  var ok = await askConfirm("Novo projeto", "Isso substitui o diagrama atual nesta janela — incluindo o modelo lógico já convertido, se houver (ele continua salvo neste navegador até ser sobrescrito). Deseja continuar?", "Criar novo", false);
  if (!ok) return;
  mode = "conceptual";
  conceptualModel = freshState("Novo Modelo Conceitual");
  logicalModel = null;
  state = conceptualModel;
  projectNameInput.value = state.projectName;
  selectedNodeIds.clear(); selectedEdgeIds.clear(); connectMode = false; connectFrom = null; pendingAdd = null;
  applyModeUI();
  render();
  fitToContent();
  showToast("Novo projeto criado.");
});

document.getElementById("btnOpen").addEventListener("click", function(){
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = async function(){
    var parsed;
    try { parsed = JSON.parse(String(reader.result)); }
    catch (err){ showToast("Arquivo inválido: não é um JSON legível.", "warn"); return; }
    var isNewFormat = parsed && parsed.conceptual && Array.isArray(parsed.conceptual.nodes) && Array.isArray(parsed.conceptual.edges);
    var isOldFormat = parsed && Array.isArray(parsed.nodes) && Array.isArray(parsed.edges);
    if (!isNewFormat && !isOldFormat){
      showToast("Arquivo inválido: não é um projeto do DER Fácil.", "warn");
      return;
    }
    var ok = await askConfirm("Abrir projeto", 'Isso substitui o diagrama atual por "' + (parsed.projectName || file.name) + '". Deseja continuar?', "Abrir", false);
    if (!ok) return;
    if (isNewFormat){
      applyLoadedProject(parsed);
    } else {
      mode = "conceptual";
      conceptualModel = normalizeLoadedState(parsed);
      logicalModel = null;
      state = conceptualModel;
    }
    projectNameInput.value = state.projectName;
    selectedNodeIds.clear(); selectedEdgeIds.clear(); connectMode = false; connectFrom = null; pendingAdd = null;
    applyModeUI();
    render();
    fitToContent();
    showToast("Projeto carregado: " + state.projectName);
  };
  reader.readAsText(file);
});

var downloadsCap = null;
(function initCapabilities(){
  try {
    if (window.claude && typeof window.claude.use === "function"){
      window.claude.use("downloads").then(function(cap){ downloadsCap = cap; });
    }
  } catch (err){ /* sem suporte a capabilities aqui */ }
})();

document.getElementById("btnSave").addEventListener("click", async function(){
  var json = JSON.stringify(buildProjectSnapshot(), null, 2);
  var base = (state.projectName || "modelo-conceitual").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "modelo-conceitual";
  var filename = base + ".json";
  if (!(window.claude && typeof window.claude.use === "function")){
    try {
      var blob = new Blob([json], { type: "application/json" });
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = blobUrl; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 1000);
      showToast("Projeto baixado como " + filename + ".");
    } catch (err){
      showToast("Não foi possível baixar o projeto agora. Seu progresso continua salvo automaticamente neste navegador.", "warn");
    }
    return;
  }
  try {
    var cap = downloadsCap || await window.claude.use("downloads");
    downloadsCap = cap;
    if (!cap){
      showToast("Exportação de arquivo não está disponível aqui agora. Seu progresso continua salvo automaticamente neste navegador.", "warn");
      return;
    }
    var res = await cap.save({ filename:filename, data:json });
    showToast(res.status === "delivered" ? "Projeto enviado." : "Projeto baixado como " + filename + ".");
  } catch (err){
    var code = err && err.code;
    if (code === "declined"){ showToast("Exportação cancelada."); }
    else if (code === "rate_limited"){ showToast("Aguarde um instante e tente novamente.", "warn"); }
    else { showToast("Não foi possível baixar o projeto agora. Seu progresso continua salvo automaticamente neste navegador.", "warn"); }
  }
});

projectNameInput.addEventListener("input", function(e){
  state.projectName = e.target.value;
  if (conceptualModel) conceptualModel.projectName = e.target.value;
  if (logicalModel) logicalModel.projectName = e.target.value;
  scheduleAutosave();
});

// Ao entrar em Modelagem Lógica: se ainda não existe um modelo lógico, gera um automaticamente
// (nada a perder). Se já existe um, pergunta a cada vez o que fazer com ele — Sim: reconverte do
// zero a partir do diagrama conceitual atual, descartando o modelo lógico existente (e qualquer
// edição manual nele); Não: abre o modelo lógico como ele já estava, sem mexer; Limpar: esvazia
// o modelo lógico (fica sem nenhuma tabela), para montar tudo manualmente do zero. "Não" é a
// opção padrão (com o foco inicial no modal).
async function switchMode(target){
  if (target === mode) return;
  if (target === "logical"){
    if (!logicalModel){
      logicalModel = convertConceptualToLogical(conceptualModel);
      showToast('Modelo lógico gerado automaticamente a partir do diagrama conceitual — os dois ficam guardados separadamente a partir de agora, então alternar entre eles não apaga suas edições.');
    } else {
      var choice = await askChoice3(
        "Reconverter modelo lógico",
        'Reconverter o modelo lógico a partir do diagrama conceitual atual? "Sim" descarta o modelo lógico existente (inclusive edições manuais) e gera um novo. "Não" abre o modelo lógico como ele está. "Limpar" esvazia o modelo lógico para você montá-lo manualmente do zero.',
        [
          { key:"no", label:"Não", className:"primary", isCancel:true, isDefault:true },
          { key:"clear", label:"Limpar" },
          { key:"yes", label:"Sim", className:"dangerous" }
        ]
      );
      if (choice === "yes"){
        logicalModel = convertConceptualToLogical(conceptualModel);
        showToast("Modelo lógico reconvertido a partir do diagrama conceitual.");
      } else if (choice === "clear"){
        logicalModel = freshLogicalState(logicalModel.projectName);
        showToast("Modelo lógico limpo — monte as tabelas manualmente ou reconverta depois.");
      }
      // "no" (ou fechar clicando fora): mantém o modelo lógico exatamente como estava.
    }
  }
  mode = target;
  state = (mode === "logical") ? logicalModel : conceptualModel;
  selectedNodeIds.clear(); selectedEdgeIds.clear(); connectMode = false; connectFrom = null; pendingAdd = null;
  projectNameInput.value = state.projectName;
  applyModeUI();
  render();
  fitToContent();
}
modeSelect.addEventListener("change", function(){
  switchMode(modeSelect.value === "logical" ? "logical" : "conceptual");
});

function openTypeManagementModal(){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal-box">' +
    '<h2>Tipos de dados</h2>' +
    '<p>Cadastre ou exclua os tipos disponíveis nos combos de tipo das colunas do modelo lógico. Use o campo "tamanho" de cada coluna para informar o que deve ir entre parênteses (ex.: 50, 10,2).</p>' +
    '<div class="type-mgmt-list" id="typeMgmtList"></div>' +
    '<div class="type-mgmt-add">' +
      '<input type="text" id="typeMgmtInput" placeholder="Novo tipo (ex.: TEXT)" maxlength="30">' +
      '<button type="button" class="hbtn" id="typeMgmtAddBtn">+ Adicionar</button>' +
    '</div>' +
    '<div class="modal-actions"><button data-a="close" class="primary">Fechar</button></div>' +
    '</div>';
  document.body.appendChild(backdrop);

  function renderList(){
    var listEl = document.getElementById("typeMgmtList");
    if (!listEl) return;
    if (!customDataTypes.length){
      listEl.innerHTML = '<div class="type-mgmt-empty">Nenhum tipo cadastrado.</div>';
      return;
    }
    listEl.innerHTML = customDataTypes.map(function(t){
      return '<div class="type-mgmt-row"><span>' + escapeHtml(t) + '</span>' +
        '<button type="button" class="col-del" data-type="' + escapeHtml(t) + '" title="Excluir tipo">×</button></div>';
    }).join("");
    listEl.querySelectorAll(".col-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        removeDataType(btn.getAttribute("data-type"));
        renderList();
        render();
      });
    });
  }
  renderList();

  function tryAdd(){
    var inp = document.getElementById("typeMgmtInput");
    var name = (inp.value || "").trim();
    if (!name){ showToast("Digite um nome de tipo para adicionar."); return; }
    var upper = name.toUpperCase();
    if (customDataTypes.some(function(t){ return t.toUpperCase() === upper; })){
      showToast("Esse tipo já está cadastrado.", "warn");
      return;
    }
    addDataType(name);
    inp.value = "";
    inp.focus();
    renderList();
    render();
  }
  document.getElementById("typeMgmtAddBtn").addEventListener("click", tryAdd);
  document.getElementById("typeMgmtInput").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); tryAdd(); }
  });

  backdrop.addEventListener("click", function(e){ if (e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('[data-a="close"]').addEventListener("click", function(){ backdrop.remove(); });
}
document.getElementById("btnManageTypes").addEventListener("click", function(){
  openTypeManagementModal();
});
